kind: service
name: gateway
version: 0.0.0
agent:
    kind: runtime::service
    name: krakend
    version: 0.0.6
    publisher: codefly.ai
service-dependencies:
    - name: organization
      module: management
    - name: accounts
      module: billing

endpoints:
    - name: rest
      visibility: public
      exposure: none
      api: rest
    - name: grpc
      visibility: public
      exposure: none
      api: grpc
