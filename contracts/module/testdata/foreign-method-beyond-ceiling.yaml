# A foreign method requiring an action beyond the module's own ceiling.
schema: codefly/module-contract/v1
principal: collector
namespaces: [collector]
queues: []
scope_ceilings:
    - resource_kind: collector.spans
      actions: [export]
bindings: []
destinations: []
foreign_methods:
    - method: /opentelemetry.proto.collector.trace.v1.TraceService/Export
      requires:
          - resource_kind: collector.spans
            actions: [erase]
