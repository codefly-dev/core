# A binding addressed to the module itself names its own kinds literally,
# never from the composition.
schema: codefly/module-contract/v1
principal: scheduler
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: scheduler.tasks
      actions: [cancel, execute, read, start]
bindings:
    - id: occurrences
      operations: [invoke]
      audience: {self: true}
      resource_kind: {from: scheduler/tasks-resource-kind}
      scope_ceiling:
          invoke: [start]
    - id: occurrence-reads
      optional: true
      operations: [invoke]
      audience: {self: true}
      binding_key: {from: scheduler/occurrence-reads-binding}
      calls:
          invoke:
              - /scheduler.v1.TasksService/GetTask
    - id: owner
      operations: [invoke]
      audience: {from: scheduler-owner/owner-audience}
      resource_kind: {from: scheduler-owner/owner-resource-kind}
      scope_ceiling:
          invoke: [read]
destinations: []
