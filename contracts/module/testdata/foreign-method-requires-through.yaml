# What a call to the module requires is its own, decided where it is served:
# a requirement is reached through nothing.
schema: codefly/module-contract/v1
principal: assistant
namespaces: [assistant]
queues: []
scope_ceilings:
    - resource_kind: assistant.spans
      actions: [export]
bindings: []
destinations: []
foreign_methods:
    - method: /opentelemetry.proto.collector.trace.v1.TraceService/Export
      requires:
          - resource_kind: assistant.spans
            actions: [export]
            through: agent
