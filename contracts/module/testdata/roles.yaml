# A solution's roles: each grants its own kinds within its scope ceilings, and
# the permissions at another module its bindings spell out for a person's
# operations. Whoever installs it holds installer.
schema: codefly/module-contract/v1
principal: wiki
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: wiki.page
      actions: [read, write, publish]
bindings:
    - id: documents
      operations: [invoke]
      audience: {from: wiki/documents-audience}
      scope_ceiling:
          invoke:
              - resource_kind: documents
                actions: [read, write]
    - id: evaluation
      operations: [headless]
      audience: {from: wiki/evaluation-audience}
      scope_ceiling:
          headless:
              - resource_kind: evaluation.definitions
                actions: [publish]
destinations: []
roles:
    - name: installer
      scopes:
          - resource_kind: wiki.page
            actions: [read, write, publish]
          - resource_kind: documents
            actions: [read, write]
    - name: editor
      scopes:
          - resource_kind: wiki.page
            actions: [read, write]
    - name: viewer
      scopes:
          - resource_kind: wiki.page
            actions: [read]
          - resource_kind: documents
            actions: [read]
