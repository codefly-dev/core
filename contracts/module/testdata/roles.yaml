# A solution's roles: each grants its own kinds within its scope ceilings, and
# the permissions at another module its bindings spell out for a person's
# operations. Whoever installs it holds installer.
schema: codefly/module-contract/v1
principal: assistant
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: assistant.tasks
      actions: [read, write, publish]
roles:
    - name: installer
      scopes:
          - resource_kind: assistant.tasks
            actions: [read, write, publish]
          - resource_kind: documents
            actions: [read, write]
    - name: editor
      scopes:
          - resource_kind: assistant.tasks
            actions: [read, write]
    - name: viewer
      scopes:
          - resource_kind: assistant.tasks
            actions: [read]
          - resource_kind: documents
            actions: [read]
bindings:
    - id: documents
      operations: [invoke]
      audience: {from: assistant/evidence-audience}
      scope_ceiling:
          invoke:
              - resource_kind: documents
                actions: [read, write]
    - id: evaluation
      operations: [headless]
      audience: {from: assistant/annotations-prefix}
      scope_ceiling:
          headless:
              - resource_kind: evaluation.definitions
                actions: [publish]
destinations: []
