# A list is delivered once per audience, and one binding key cannot install them all.
schema: codefly/module-contract/v1
principal: assistant
namespaces: [assistant]
queues: []
scope_ceilings: []
bindings:
    - id: owner
      operations: [invoke]
      audiences: {from: assistant/owner-audiences}
      resource_kinds: {from: assistant/owner-resource-kinds}
      binding_key: {from: assistant/owner-binding}
      scope_ceiling:
          invoke: [read]
destinations: []
