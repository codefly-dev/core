# One resource kind beside an audience list would name one module's kind at every other.
schema: codefly/module-contract/v1
principal: assistant
namespaces: [assistant]
queues: []
scope_ceilings: []
bindings:
    - id: owner
      operations: [invoke]
      audiences: {from: assistant/owner-audiences}
      resource_kind: {from: assistant/owner-resource-kind}
      scope_ceiling:
          invoke: [read]
destinations: []
