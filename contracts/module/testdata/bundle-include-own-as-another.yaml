# A bundle of the same module is included by its name, never as another module's.
schema: codefly/module-contract/v1
principal: assistant
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: agent.turns
      actions: [read, run]
bindings: []
destinations: []
bundles:
    - name: talk
      scopes: [{resource_kind: agent.turns, actions: [run]}]
    - name: review
      includes: [{module: assistant, bundle: talk, through: assistant}]
      scopes: [{resource_kind: agent.turns, actions: [read]}]
