# A binding is addressed to one audience or to a list of them, never both.
schema: codefly/module-contract/v1
principal: assistant
namespaces: [assistant]
queues: []
scope_ceilings: []
bindings:
    - id: owner
      operations: [invoke]
      audience: {from: assistant/owner-audience}
      audiences: {from: assistant/owner-audiences}
      resource_kinds: {from: assistant/owner-resource-kinds}
      scope_ceiling:
          invoke: [read]
destinations: []
