# A bundle never includes itself, through any chain.
schema: codefly/module-contract/v1
principal: assistant
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: agent.turns
      actions: [read, run]
bindings: []
destinations: []
bundles:
    - name: talk
      includes: [review]
      scopes: [{resource_kind: agent.turns, actions: [run]}]
    - name: review
      includes: [talk]
      scopes: [{resource_kind: agent.turns, actions: [read]}]
