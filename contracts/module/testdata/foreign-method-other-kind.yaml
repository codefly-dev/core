# A foreign method requiring another module's kind.
schema: codefly/module-contract/v1
principal: assistant
namespaces: [assistant]
queues: []
scope_ceilings:
    - resource_kind: assistant.spans
      actions: [export]
bindings: []
destinations: []
foreign_methods:
    - method: /opentelemetry.proto.collector.trace.v1.TraceService/Export
      requires:
          - resource_kind: documents
            actions: [read]
