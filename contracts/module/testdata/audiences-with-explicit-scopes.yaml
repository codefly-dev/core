# An explicit scope beside an audience list would name one kind at every listed
# audience, though each audience's kinds are its own: a list names its calls, or
# qualifies bare actions per audience in resource_kinds.
schema: codefly/module-contract/v1
principal: assistant
namespaces: [assistant]
queues: []
scope_ceilings: []
bindings:
    - id: owner
      operations: [invoke]
      audiences: {from: assistant/owner-audiences}
      scope_ceiling:
          invoke:
              - resource_kind: targets.items
                actions: [read]
destinations: []
