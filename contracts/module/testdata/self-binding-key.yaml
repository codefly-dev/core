# Only an audience may be the module itself; a binding key never is.
schema: codefly/module-contract/v1
principal: scheduler
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: scheduler.tasks
      actions: [cancel, execute, read, start]
bindings:
    - id: occurrences
      operations: [invoke]
      audience: {self: true}
      scope_ceiling:
          invoke:
              - resource_kind: scheduler.tasks
                actions: [cancel, execute, start]
    - id: occurrence-reads
      optional: true
      operations: [invoke]
      audience: {self: true}
      binding_key: {self: true}
      calls:
          invoke:
              - /scheduler.v1.TasksService/GetTask
    - id: owner
      operations: [invoke]
      audience: {from: scheduler-owner/owner-audience}
      resource_kind: {from: scheduler-owner/owner-resource-kind}
      scope_ceiling:
          invoke: [read]
destinations: []
