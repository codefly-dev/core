# A role granting a permission only a headless binding asks for: no person
# is in a headless operation, so no role can hold what it carries.
schema: codefly/module-contract/v1
principal: wiki
namespaces: []
queues: []
scope_ceilings:
    - resource_kind: wiki.page
      actions: [read, write, publish]
bindings:
    - id: documents
      operations: [invoke]
      audience: {from: wiki/documents-audience}
      scope_ceiling:
          invoke:
              - resource_kind: documents
                actions: [read, write]
    - id: evaluation
      operations: [headless]
      audience: {from: wiki/evaluation-audience}
      scope_ceiling:
          headless:
              - resource_kind: evaluation.definitions
                actions: [publish]
destinations: []
roles:
    - name: installer
      scopes:
          - resource_kind: wiki.page
            actions: [read]
          - resource_kind: evaluation.definitions
            actions: [publish]
