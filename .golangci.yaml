# golangci-lint v2 configuration.
version: "2"

# Run settings
run:
  # Timeout for analysis, e.g. "5m", "10m30s" or "2h"
  timeout: 5m

# Linters settings
linters:
  enable:
    - revive
    #- gocritic
    - gosec
    - errcheck
    - staticcheck
    - unused
    - goconst
    - gocyclo
    - misspell

  disable:
    - gochecknoinits
    - gochecknoglobals

  # Linters settings
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    gocritic:
      enabled-checks:
        - rangeValCopy
        - appendCombine
        - hugeParam

  # Service settings
  exclusions:
    rules:
      - linters:
          - govet
        text: "composite literal uses unkeyed fields"
      - linters:
          - revive
        text: "should have comment or be unexported"
    paths:
      - ".*\\.pb\\.go"
      - ".*_test\\.go"

# gofmt and goimports are formatters in v2, not linters.
formatters:
  enable:
    - gofmt
    - goimports
