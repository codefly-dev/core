kind: service
name: vault
agent:
  kind: runtime::service
  name: go-grpc
  version: 0.0.1
  publisher: codefly.ai
endpoints:
  - name: grpc
    api: grpc
    visibility: internal
    allow-modules: ["*"]
  - name: rest
    api: rest
    visibility: public
    location: external
  - name: http
    api: http
    visibility: internal
    allow-modules: [platform]
  - name: tcp
    api: tcp
    visibility: private
  - name: conn
    api: connect
    visibility: public
