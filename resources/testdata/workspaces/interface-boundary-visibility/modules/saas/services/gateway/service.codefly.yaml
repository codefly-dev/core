kind: service
name: gateway
version: 0.0.0
agent:
  kind: runtime::service
  name: go-grpc
  version: 0.0.1
  publisher: codefly.ai
endpoints:
  - name: public
    api: rest
    visibility: public
    exposure: none
  - name: restricted
    api: grpc
    visibility: private
  - name: omitted
    api: http
    visibility: public
    exposure: none
