name: companions-build

# Builds every companion image without publishing, so a Dockerfile that no
# longer builds fails here rather than when an operator dispatches the CLI's
# publish workflow. Publishing itself belongs to the CLI (see
# docs/runbooks/publish-companions.md); this repository only proves that what
# it hands over is buildable.
#
# The set and every per-companion build input come from companions.BuildSpecs()
# via internal/buildspecs, so this workflow holds no companion-specific
# knowledge and cannot drift from the specs the publisher builds from.
on:
  pull_request:
    paths:
      - companions/**
      - internal/buildspecs/**
      - .dockerignore
      - .github/workflows/companions-build.yml
  push:
    branches: [main]
    paths:
      - companions/**
      - internal/buildspecs/**
      - .dockerignore
      - .github/workflows/companions-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      companions: ${{ steps.specs.outputs.companions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - id: specs
        run: echo "companions=$(go run ./internal/buildspecs)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    # The proto companion compiles ~10 Go plugins from source and its arm64
    # half runs under QEMU emulation.
    timeout-minutes: 180
    strategy:
      # One companion failing to build must not hide whether the others do.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.companions) }}
    steps:
      - uses: actions/checkout@v4

      - name: stage the codefly CLI binary
        # Companions that bake a CLI declare where they expect it. This
        # repository cannot build the CLI (it lives in codefly-dev/cli), so the
        # latest release binary is staged at the declared path for every
        # architecture the spec targets. It is the real executable, so a
        # Dockerfile that runs it during the build is exercised here too.
        # Publishing stages a binary cross-compiled from the CLI checkout
        # instead; this only has to be a codefly binary, not that one.
        if: matrix.cli_binary != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_BINARY: ${{ matrix.cli_binary }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/codefly-dev/cli/releases/latest --jq .tag_name)
          version=${tag#v}
          for platform in ${PLATFORMS//,/ }; do
            arch=${platform#linux/}
            path=${CLI_BINARY//'${TARGETARCH}'/$arch}
            mkdir -p "$(dirname "$path")"
            curl -fsSL -o cli.tar.gz \
              "https://github.com/codefly-dev/cli/releases/download/${tag}/codefly_${version}_linux_${arch}.tar.gz"
            tar -xzf cli.tar.gz -O codefly > "$path"
            chmod +x "$path"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: type=gha,scope=companion-${{ matrix.companion }}
          cache-to: type=gha,mode=max,scope=companion-${{ matrix.companion }}
