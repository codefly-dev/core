name: go-service-ci

on:
  workflow_call:
    inputs:
      setup-run:
        description: Optional shell command run before the test suite (e.g. docker pull of a test dependency).
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Reusable: this job runs the CALLING repository's code, at a ref that
      # repository chooses -- which may be a pull request's head. Declared here
      # rather than inherited, because an inherited grant is one neither side
      # can read. See internal/ciguard/untrusted_code_test.go.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.mod pins a `toolchain` newer than the `go` line, so GOTOOLCHAIN
          # downloads the toolchain module into the cache; setup-go's cache tar
          # then corrupts it on restore (tar: .../toolchain@.../*: File exists),
          # and generated-service builds fail with "package … is not in std".
          # Skip the cache so every build uses an intact toolchain.
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

  test:
    runs-on: ubuntu-latest
    permissions:
      # The caller's code again; same reasoning as the job above.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.mod pins a `toolchain` newer than the `go` line, so GOTOOLCHAIN
          # downloads the toolchain module into the cache; setup-go's cache tar
          # then corrupts it on restore (tar: .../toolchain@.../*: File exists),
          # and generated-service builds fail with "package … is not in std".
          # Skip the cache so every build uses an intact toolchain.
          cache: false
      - name: Setup
        if: inputs.setup-run != ''
        # Through the environment rather than interpolated into the script --
        # see the note on the same step in go-service-release.yml.
        env:
          SETUP_RUN: ${{ inputs.setup-run }}
        run: eval "$SETUP_RUN"
      - name: Test
        run: go test -v ./...
