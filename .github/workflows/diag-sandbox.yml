# TEMPORARY diagnostic — removed before merge. TestLoadArtifactSandbox hangs in
# executor cleanup on the ubuntu-26.04 runner image and passes everywhere else.
name: diag-sandbox
on:
  pull_request:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: environment
        run: |
          uname -a; cat /etc/os-release | head -2
          echo "pid1: $(cat /proc/1/comm)"; echo "apparmor userns restrict: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)"
          echo "ancestry:"; p=$$; while [ "$p" != 1 ] && [ -n "$p" ]; do echo "  $(ps -o pid=,ppid=,comm= -p $p)"; p=$(ps -o ppid= -p $p | tr -d ' '); done
          sudo apt-get install -y -qq bubblewrap >/dev/null; bwrap --version; mount | grep -E " /tmp | /proc " || true
      - name: the sandbox test on this runner
        run: |
          sudo apt-get install -y -qq bubblewrap >/dev/null
          go test -tags sandbox_e2e -run 'TestLoadArtifactSandbox|TestBwrap' -count=1 -v ./agents/manager ./runners/sandbox 2>&1 | grep -vE "^go: downloading" | tail -30
          echo "--- survivors"; ps -eo pid,ppid,pgid,sid,stat,comm | grep -E "executor|bwrap" | grep -v grep || echo "none"
