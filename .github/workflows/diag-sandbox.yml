# TEMPORARY diagnostic — removed before merge. TestLoadArtifactSandbox hangs in
# executor cleanup on the ubuntu-26.04 runner image and passes everywhere else.
name: diag-sandbox
on:
  pull_request:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: environment
        run: |
          uname -a; cat /etc/os-release | head -2
          echo "pid1: $(cat /proc/1/comm)"; echo "apparmor userns restrict: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)"
          echo "ancestry:"; p=$$; while [ "$p" != 1 ] && [ -n "$p" ]; do echo "  $(ps -o pid=,ppid=,comm= -p $p)"; p=$(ps -o ppid= -p $p | tr -d ' '); done
          sudo apt-get install -y -qq bubblewrap >/dev/null; bwrap --version; mount | grep -E " /tmp | /proc " || true
      - name: test with process snapshots
        shell: bash {0}
        run: |
          snapshot() {
            echo "--- ps $(date +%T)"
            ps -eo pid,ppid,pgid,sid,stat,uid,comm | grep -E "executor|bwrap|acquired|manager.test|\.test$" | grep -v grep || true
            for pid in $(pgrep executor; pgrep acquired; pgrep bwrap); do
              [ -r /proc/$pid/status ] || continue
              echo "  /proc/$pid: $(grep -E '^(Name|State|PPid|NSpid|Uid|CapEff|NoNewPrivs|Seccomp):' /proc/$pid/status | tr '\n' ' ' | tr -s '\t ' ' ')"
              echo "  exe: $(readlink /proc/$pid/exe 2>&1)"; echo "  stat: $(cut -c1-120 /proc/$pid/stat 2>&1)"
              echo "  environ: $(tr '\0' '\n' < /proc/$pid/environ 2>&1 | grep -cE '.' ) lines; $(tr '\0' '\n' < /proc/$pid/environ 2>&1 | grep -E 'CODEFLY' | cut -c1-40 | tr '\n' ' ')"
              echo "  ns: $(ls -l /proc/$pid/ns/ 2>&1 | awk '{print $9, $11}' | tr '\n' ' ')"; echo "  self ns: $(ls -l /proc/self/ns/ | awk '{print $9, $11}' | tr '\n' ' ')"
              echo "  apparmor: $(cat /proc/$pid/attr/current 2>&1)"; echo "  cmdline: $(tr '\0' ' ' < /proc/$pid/cmdline 2>&1 | cut -c1-200)"
              pg=$(ps -o pgid= -p $pid | tr -d ' '); kill -0 -- -$pg 2>&1 && echo "  kill -0 -$pg: ok" || echo "  kill -0 -$pg: refused ($?)"
            done
          }
          echo "yama: $(cat /proc/sys/kernel/yama/ptrace_scope)"; echo "self apparmor: $(cat /proc/self/attr/current)"; mount | grep -E " /proc " || true
          cat /etc/apparmor.d/bwrap* 2>/dev/null | grep -vE "^\s*#|^\s*$" | head -30 || true
          ( for i in $(seq 1 12); do sleep 1; snapshot; done; while true; do sleep 5; snapshot; done ) &
          SNAP=$!
          go test -tags sandbox_e2e -run 'TestLoadArtifactSandbox' -count=1 -v ./agents/manager 2>&1 | grep -vE "^go: downloading" | tail -60
          kill $SNAP 2>/dev/null || true
          echo "--- after"; snapshot
          echo "--- leftovers"; ls -la /tmp/executor-* 2>/dev/null || true
          echo "--- dmesg tail"; sudo dmesg 2>/dev/null | tail -15 || true
