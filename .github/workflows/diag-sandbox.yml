# TEMPORARY diagnostic — removed before merge. TestLoadArtifactSandbox hangs in
# executor cleanup on the ubuntu-26.04 runner image and passes everywhere else.
name: diag-sandbox
on:
  pull_request:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: environment
        run: |
          uname -a; cat /etc/os-release | head -2
          echo "pid1: $(cat /proc/1/comm)"; echo "apparmor userns restrict: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)"
          echo "ancestry:"; p=$$; while [ "$p" != 1 ] && [ -n "$p" ]; do echo "  $(ps -o pid=,ppid=,comm= -p $p)"; p=$(ps -o ppid= -p $p | tr -d ' '); done
          sudo apt-get install -y -qq bubblewrap >/dev/null; bwrap --version; mount | grep -E " /tmp | /proc " || true
      - name: test with process snapshots
        shell: bash {0}
        run: |
          echo "bwrap: $(ls -l /usr/bin/bwrap) :: $(file -b /usr/bin/bwrap | cut -c1-60)"
          echo "yama: $(cat /proc/sys/kernel/yama/ptrace_scope)"
          snapshot() {
            T=$(ps -eo pid,ppid,pgid,sid,stat,comm,args --forest 2>/dev/null | grep -vE "ps -eo|grep|snapshot|sleep" | grep -E "manager.test|executor|bwrap|acquired|codefly|CODEFLY| sh |sh -c" || true)
            if [ "$T" != "$LAST" ]; then echo "--- ps $(date +%T.%N | cut -c1-12)"; echo "$T" | cut -c1-200; LAST="$T"; fi
          }
          ( LAST=""; while true; do snapshot; sleep 0.3; done ) &
          SNAP=$!
          go test -tags sandbox_e2e -run 'TestLoadArtifactSandbox' -count=1 -v ./agents/manager 2>&1 | grep -vE "^go: downloading" | tail -40
          kill $SNAP 2>/dev/null || true
          echo "--- pgid records"; find /tmp -name '*.pgid' 2>/dev/null | while read f; do echo "$f"; cat "$f" | cut -c1-400; echo; done
          echo "--- survivors"; ps -eo pid,ppid,pgid,sid,stat,comm,args | grep -E "executor|bwrap" | grep -v grep || true
          for pid in $(pgrep executor); do echo "  SIGTERM $pid"; kill -TERM $pid; sleep 2; ps -o pid,stat,comm -p $pid || true; echo "  SIGKILL $pid"; kill -KILL $pid; sleep 1; ps -o pid,stat,comm -p $pid || echo "  gone"; done
          echo "--- apparmor audit"; sudo dmesg 2>/dev/null | grep -iE "apparmor|DENIED" | grep -vE "systemd-detect|rsyslog|snap|docker|STATUS" | tail -20 || true
