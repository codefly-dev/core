name: go-service-release

on:
  workflow_call:
    inputs:
      setup-run:
        description: Optional shell command run before the test suite (e.g. docker pull of a test dependency).
        type: string
        default: ''
      goreleaser-version:
        description: Version constraint passed to goreleaser-action.
        type: string
        default: '~> v2'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Reusable: this job runs the CALLING repository's code, at a ref that
      # repository chooses -- which may be a pull request's head. Declared here
      # rather than inherited, because an inherited grant is one neither side
      # can read. See internal/ciguard/untrusted_code_test.go.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.mod pins a `toolchain` newer than the `go` line, so setup-go
          # installs the older Go and GOTOOLCHAIN downloads the toolchain module
          # into the cache. setup-go's cache tar then collides on those
          # read-only toolchain files (tar: .../toolchain@.../cgo: File exists),
          # failing every release. Release builds are infrequent; skip the cache.
          cache: false
      - name: Setup
        if: inputs.setup-run != ''
        run: ${{ inputs.setup-run }}
      - name: Test
        run: go test -v ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Read as well. GoReleaser authenticates to the forge with the GH_PAT the
      # caller passes (see the `env:` on its step), never with this job's
      # token, so the release needs no write grant here -- and a caller that
      # grants its release job write does not hand that grant to this one.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.mod pins a `toolchain` newer than the `go` line, so setup-go
          # installs the older Go and GOTOOLCHAIN downloads the toolchain module
          # into the cache. setup-go's cache tar then collides on those
          # read-only toolchain files (tar: .../toolchain@.../cgo: File exists),
          # failing every release. Release builds are infrequent; skip the cache.
          cache: false
      - name: Install Syft for archive SBOMs
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.44.0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ inputs.goreleaser-version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
