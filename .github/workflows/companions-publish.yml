name: companions-publish

# Publishes the six companion images to ghcr.io/codefly-dev. Each job is a
# no-op unless companions/<name>/info.codefly.yaml carries a version that is
# not published yet, so landing an unrelated companions/ change costs one
# manifest lookup per companion.
on:
  push:
    branches: [main]
    paths:
      - companions/**
      - .github/workflows/companion-publish.yml
      - .github/workflows/companions-publish.yml
  workflow_dispatch:
    inputs:
      companion:
        description: Publish only this companion (leave as "all" for the whole set).
        type: choice
        default: all
        options: [all, codefly, execution, go, node, proto, python]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      codefly: ${{ steps.select.outputs.codefly }}
      dependents: ${{ steps.select.outputs.dependents }}
    steps:
      - id: select
        env:
          SELECTED: ${{ inputs.companion || 'all' }}
        run: |
          set -euo pipefail
          dependents='["execution","go","node","proto","python"]'
          if [ "$SELECTED" = "all" ]; then
            echo "codefly=true" >> "$GITHUB_OUTPUT"
            echo "dependents=${dependents}" >> "$GITHUB_OUTPUT"
          elif [ "$SELECTED" = "codefly" ]; then
            echo "codefly=true" >> "$GITHUB_OUTPUT"
            echo 'dependents=[]' >> "$GITHUB_OUTPUT"
          else
            echo "codefly=false" >> "$GITHUB_OUTPUT"
            echo "dependents=[\"${SELECTED}\"]" >> "$GITHUB_OUTPUT"
          fi

  # go, node, proto and python all COPY --from the published codefly image, so
  # the base has to land before them.
  codefly:
    needs: plan
    if: needs.plan.outputs.codefly == 'true'
    uses: ./.github/workflows/companion-publish.yml
    with:
      companion: codefly

  dependents:
    needs: [plan, codefly]
    # codefly is skipped when the dispatch selects a single other companion;
    # a skipped dependency must not skip this job too.
    if: always() && needs.plan.result == 'success' && needs.codefly.result != 'failure' && needs.codefly.result != 'cancelled' && needs.plan.outputs.dependents != '[]'
    strategy:
      fail-fast: false
      matrix:
        companion: ${{ fromJSON(needs.plan.outputs.dependents) }}
    uses: ./.github/workflows/companion-publish.yml
    with:
      companion: ${{ matrix.companion }}
