name: companions-publish

# Publishes the companion images to ghcr.io/codefly-dev. Each job is a
# no-op unless companions/<name>/info.codefly.yaml carries a version that is
# not published yet, so landing an unrelated companions/ change costs one
# manifest lookup per companion.
#
# The set of companions and every per-companion build input come from
# companions.BuildSpecs() via internal/buildspecs, so this workflow and the
# specs the CLI will build from cannot disagree.
on:
  push:
    branches: [main]
    paths:
      - companions/**
      - internal/buildspecs/**
      - .github/workflows/companion-publish.yml
      - .github/workflows/companions-publish.yml
  workflow_dispatch:
    inputs:
      companion:
        description: Publish only this companion (leave as "all" for the whole set).
        type: string
        default: all

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish_codefly: ${{ steps.select.outputs.publish_codefly }}
      codefly: ${{ steps.select.outputs.codefly }}
      dependents: ${{ steps.select.outputs.dependents }}
      base_digest: ${{ steps.base.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - id: select
        env:
          SELECTED: ${{ inputs.companion || 'all' }}
        run: |
          set -euo pipefail
          specs=$(go run ./internal/buildspecs)
          if ! jq -e --arg n "$SELECTED" '$n == "all" or any(.[]; .companion == $n)' >/dev/null <<<"$specs"; then
            echo "unknown companion \"$SELECTED\"; known: $(jq -r '[.[].companion] | join(", ")' <<<"$specs")" >&2
            exit 1
          fi
          codefly=$(jq -c '.[] | select(.companion == "codefly")' <<<"$specs")
          case "$SELECTED" in
            all)
              publish_codefly=true
              dependents=$(jq -c '[.[] | select(.companion != "codefly")]' <<<"$specs")
              ;;
            codefly)
              publish_codefly=true
              dependents='[]'
              ;;
            *)
              publish_codefly=false
              dependents=$(jq -c --arg n "$SELECTED" '[.[] | select(.companion == $n)]' <<<"$specs")
              ;;
          esac
          {
            echo "publish_codefly=${publish_codefly}"
            echo "codefly=${codefly}"
            echo "dependents=${dependents}"
          } >> "$GITHUB_OUTPUT"

      - name: resolve the already-published base digest
        # Covers the dispatch that publishes a single dependent without
        # rebuilding codefly: the base is still pinned by digest rather than by
        # the mutable tag. Empty when the pinned version is not published yet,
        # in which case this run publishes it and its own digest is used.
        id: base
        run: |
          set -uo pipefail
          ref="ghcr.io/codefly-dev/codefly:$(jq -r .version <<<'${{ steps.select.outputs.codefly }}')"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}' 2>/dev/null || true)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  # go, node, proto and python all build on the published codefly image, so the
  # base has to land before them. A test pins every spec's base to codefly, so
  # a companion introducing a second base tier fails before it reaches here.
  codefly:
    needs: plan
    if: needs.plan.outputs.publish_codefly == 'true'
    uses: ./.github/workflows/companion-publish.yml
    with:
      companion: ${{ fromJSON(needs.plan.outputs.codefly).companion }}
      version: ${{ fromJSON(needs.plan.outputs.codefly).version }}
      dockerfile: ${{ fromJSON(needs.plan.outputs.codefly).dockerfile }}
      context: ${{ fromJSON(needs.plan.outputs.codefly).context }}
      platforms: ${{ fromJSON(needs.plan.outputs.codefly).platforms }}
      cli_binary: ${{ fromJSON(needs.plan.outputs.codefly).cli_binary }}

  dependents:
    needs: [plan, codefly]
    # codefly is skipped when the dispatch selects a single other companion;
    # a skipped dependency must not skip this job too.
    if: always() && needs.plan.result == 'success' && needs.codefly.result != 'failure' && needs.codefly.result != 'cancelled' && needs.plan.outputs.dependents != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.dependents) }}
    uses: ./.github/workflows/companion-publish.yml
    with:
      companion: ${{ matrix.companion }}
      version: ${{ matrix.version }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      platforms: ${{ matrix.platforms }}
      cli_binary: ${{ matrix.cli_binary }}
      # Dependents build against the exact base this run published, not a
      # mutable tag. Empty when codefly was skipped, which leaves the
      # Dockerfile's own pinned default in place.
      base_image: ${{ matrix.base != '' && (needs.codefly.outputs.digest || needs.plan.outputs.base_digest) != '' && format('ghcr.io/codefly-dev/{0}@{1}', matrix.base, needs.codefly.outputs.digest || needs.plan.outputs.base_digest) || '' }}
