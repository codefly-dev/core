name: agent-ci

# Full-lifecycle codefly agent validation, shared by every service agent.
# `codefly agent ci` runs the source, release, and generated-service
# conformance gates against the calling repo's agent, using the codefly.dev/go
# source-packager the CLI pins. Callers add a thin workflow that dispatches this
# one (see any service repo's .github/workflows/agent-ci.yml).
on:
  workflow_call:
    inputs:
      codefly-cli-version:
        description: Released codefly CLI version to validate with (no leading v).
        type: string
        required: true

jobs:
  agent-ci:
    runs-on: ubuntu-latest
    permissions:
      # Reusable: this job runs the CALLING repository's code, at a ref that
      # repository chooses -- which may be a pull request's head. Declared here
      # rather than inherited, because an inherited grant is one neither side
      # can read. See internal/ciguard/untrusted_code_test.go.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.mod pins a `toolchain` newer than the `go` line, so GOTOOLCHAIN
          # downloads the toolchain module into the cache; setup-go's cache tar
          # then corrupts it on restore. Skip the cache so the toolchain stays
          # intact for the source-packager build.
          cache: false
      - name: install codefly CLI
        # The version reaches the script as a value, not as text spliced into
        # it, and is checked against the shape a release tag has before it is
        # used in a URL. A caller's input is not hostile here -- it comes from
        # that repository's own workflow -- but a `run:` assembled by
        # substitution is a program assembled by its caller, and this job runs
        # the caller's tree.
        env:
          CLI_VERSION: ${{ inputs.codefly-cli-version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CLI_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::codefly-cli-version must be a bare semver (x.y.z), got <${CLI_VERSION}>" >&2
            exit 1
          fi
          curl -fsSL -o codefly.tar.gz \
            "https://github.com/codefly-dev/cli/releases/download/v${CLI_VERSION}/codefly_${CLI_VERSION}_linux_amd64.tar.gz"
          tar -xzf codefly.tar.gz codefly
          install -m 0755 codefly /usr/local/bin/codefly
          codefly version
      - name: install codefly.dev/go source-packager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: codefly agent install codefly.dev/go
      - name: codefly agent ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: codefly agent ci
