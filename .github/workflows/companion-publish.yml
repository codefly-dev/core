name: companion-publish

# Builds and publishes one companion image to the canonical registry
# (ghcr.io/codefly-dev, see resources.ImageRegistry). Called per companion by
# companions-publish.yml, which owns the trigger and the build order.
#
# Tags are immutable: a companion whose ghcr tag already exists is skipped, so
# changing an image REQUIRES bumping companions/<name>/info.codefly.yaml.
on:
  workflow_call:
    inputs:
      companion:
        description: Companion directory under companions/ to build and publish.
        type: string
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The proto companion compiles ~10 Go plugins from source, and the arm64
    # half of that runs under QEMU emulation. The other five are apk + COPY.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: resolve image reference and build inputs
        id: plan
        env:
          COMPANION: ${{ inputs.companion }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' "companions/${COMPANION}/info.codefly.yaml" | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "companions/${COMPANION}/info.codefly.yaml has no version" >&2
            exit 1
          fi
          case "$COMPANION" in
            # These two COPY the cross-built codefly binary out of the repo
            # root, so the build context is the whole checkout.
            codefly|execution) context=. ;;
            *)                 context="companions/${COMPANION}" ;;
          esac
          case "$COMPANION" in
            # execution's Dockerfile copies bin/linux/codefly without consulting
            # TARGETARCH, so a multi-platform build would bake the amd64 binary
            # into the arm64 image. Single-platform until that COPY is arch-aware.
            execution) platforms=linux/amd64 ;;
            *)         platforms=linux/amd64,linux/arm64 ;;
          esac
          {
            echo "version=${version}"
            echo "context=${context}"
            echo "platforms=${platforms}"
            echo "image=ghcr.io/codefly-dev/${COMPANION}"
            echo "ref=ghcr.io/codefly-dev/${COMPANION}:${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: skip when the tag is already published
        id: published
        run: |
          set -uo pipefail
          if docker manifest inspect "${{ steps.plan.outputs.ref }}" >/dev/null 2>&1; then
            echo "${{ steps.plan.outputs.ref }} already published — bump companions/${{ inputs.companion }}/info.codefly.yaml to publish a change."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: stage the codefly CLI binaries
        # The codefly and execution images bake a released CLI. Every other
        # companion picks it up via COPY --from the published codefly image.
        if: steps.published.outputs.exists == 'false' && contains(fromJSON('["codefly","execution"]'), inputs.companion)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/codefly-dev/cli/releases/latest --jq .tag_name)
          version=${tag#v}
          echo "baking codefly CLI ${version}"
          for arch in amd64 arm64; do
            mkdir -p "bin/linux/${arch}"
            curl -fsSL -o cli.tar.gz \
              "https://github.com/codefly-dev/cli/releases/download/${tag}/codefly_${version}_linux_${arch}.tar.gz"
            tar -xzf cli.tar.gz -C "bin/linux/${arch}" codefly
            chmod +x "bin/linux/${arch}/codefly"
          done
          install -m 0755 bin/linux/amd64/codefly bin/linux/codefly

      - uses: docker/setup-qemu-action@v3
        if: steps.published.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.exists == 'false'

      - name: build and push
        id: build
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.plan.outputs.context }}
          file: companions/${{ inputs.companion }}/Dockerfile
          platforms: ${{ steps.plan.outputs.platforms }}
          push: true
          tags: ${{ steps.plan.outputs.ref }}
          # Attestation comes from actions/attest-build-provenance below, which
          # produces a signed, verifiable one; buildx's inline variants would
          # only add unsigned manifest entries.
          provenance: false
          sbom: false

      - uses: actions/attest-build-provenance@v2
        if: steps.published.outputs.exists == 'false'
        with:
          subject-name: ${{ steps.plan.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: verify the package is anonymously pullable
        # ghcr packages default to private on first push, which silently breaks
        # every consumer that pulls without credentials. Inspect the manifest
        # with an empty docker config so the check carries no token.
        if: steps.published.outputs.exists == 'false'
        run: |
          set -euo pipefail
          config=$(mktemp -d)
          echo '{}' > "${config}/config.json"
          if ! DOCKER_CONFIG="${config}" docker manifest inspect "${{ steps.plan.outputs.ref }}"; then
            echo "${{ steps.plan.outputs.ref }} is not anonymously pullable." >&2
            echo "Make the package public at https://github.com/orgs/codefly-dev/packages/container/${{ inputs.companion }}/settings" >&2
            echo "and link it to codefly-dev/core. See docs/runbooks/publish-companions.md." >&2
            exit 1
          fi
