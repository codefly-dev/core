# Dependency updates for every ecosystem this repository ships.
#
# Each ecosystem is ONE catch-all group with open-pull-requests-limit 1, so a
# week yields at most one pull request per ecosystem instead of one per
# dependency. Dependabot cannot group ACROSS ecosystems, so the entries below
# are the floor on what Dependabot itself opens; .github/workflows/combine-
# deps.yml runs afterwards and folds whatever is open into a single pull
# request.
#
# The groups deliberately carry NO `update-types:` filter. That filter only
# recognises semver update types, so a Docker base image pinned by digest
# matches none of them and falls OUT of the group into its own ungrouped pull
# request, one per directory. Omitting the filter makes `patterns: "*"` mean
# what it says: everything, digests included. For the same reason majors are
# not split into a second group — that is a guaranteed extra pull request.
#
# Security updates keep their own group where one is defined: `applies-to`
# separates them from version updates and they are not capped by
# open-pull-requests-limit, because an urgent fix should not queue behind
# routine work.
version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /companions/proto/facades/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      gomod:
        patterns:
          - '*'
    ignore:
      # grpc v1.84.0 reintroduces GO-2026-6443 (server panic on a request
      # carrying neither :authority nor Host). The advisory fixes it in
      # v1.83.2, reopens it at v1.84.0-dev, and closes it again only in a
      # v1.85.0-dev pseudo-version — an unreleased master commit. v1.84.0 is
      # the newest tag, so "upgrade" is backwards here until v1.85.0 ships.
      # govulncheck reaches it from agents.Serve, so this is a live path in
      # core's own agent server, not a graph artifact. #595 took the bump and
      # went red on ./scripts/govulncheck.sh; without this entry Dependabot
      # re-opens the same red pull request every week.
      #
      # This is a HOLD, not a fix, and it is deliberately blunt: the narrow
      # `versions: ['1.84.0']` this wants to be is rejected by
      # TestDependabotIgnoresNeverSuppressSecurityUpdates, because a version
      # range suppresses security advisories as well as routine bumps. Only
      # `update-types` stays on the version-update side, and it cannot name a
      # version — so it pins grpc at v1.83.2 against ALL routine updates until
      # someone deletes these four lines. Lift it when grpc v1.85.0 is tagged:
      # codefly-dev/core#615.
      - dependency-name: google.golang.org/grpc
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: npm
    directories:
      - /companions/proto/facades/ts
      - /companions/proto/ts-generators
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # The protobuf-es family is pinned in four places that must move
      # together — facades/ts/package.json, the Dockerfile's protoc-gen-es,
      # protocGenEsRuntimeVersion in companion_plugins_test.go, and flake.nix
      # (plus its two vendored Nix hashes). Dependabot sees only the first, so
      # a bump it opens alone lands red on the lockstep guards, as #447 did.
      # Grouping does not help: a group bundles updates into one pull request,
      # it does not hold a pin to versions in files Dependabot cannot read.
      # These bump by hand, across all four, or not at all.
      #
      # The three semver types are listed explicitly rather than left as a bare
      # `dependency-name`. A bare ignore would also suppress SECURITY updates
      # for the scope; `update-types` applies only to version updates, so a
      # protobuf-es advisory still opens a pull request. A `versions:` range
      # would not have that property — it covers security updates too.
      - dependency-name: '@bufbuild/*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: pip
    directory: /generated/python/codefly-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns:
          - '*'
  - package-ecosystem: docker
    directories:
      - /companions/go
      - /companions/node
      - /companions/proto
      - /companions/python
      - /companions/codefly
      - /companions/execution
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
