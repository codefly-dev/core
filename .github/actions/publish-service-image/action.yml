name: Publish service image
description: Publish a merged service image by digest and return its release lock.
# This is a STEP in the service's own job: GHCR authorizes that repository.
# The caller checks out the triggering commit with persist-credentials: false,
# grants contents: read and packages: write, gates the job to workflow_dispatch,
# and sets timeout-minutes: 30. Do not run service code before this action.
inputs:
  image-name:
    description: Optional lowercase image name inside core's registry; defaults to the caller repository name.
    default: ''
  version:
    description: Upcoming stable service version without a v prefix.
    required: true
  lock-file:
    description: Plain file name for the release lock, of the form <name>-image.json.
    default: gateway-image.json
  platforms:
    description: Comma-separated os/arch pairs covered by the caller's evidence.
    default: linux/amd64,linux/arm64
  registry-token:
    description: The caller job's GITHUB_TOKEN with packages write; passed only to registry login.
    required: true
outputs:
  digest:
    description: The sha256 digest of the pushed image index.
    value: ${{ steps.build.outputs.digest }}
  lock:
    description: Compact JSON release lock, also uploaded as an artifact.
    value: ${{ steps.lock.outputs.json }}
runs:
  using: composite
  steps:
    - name: require the commit to be on the default branch, or refuse
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
          echo "::error::service images may only be published by workflow_dispatch; refusing to publish." >&2
          exit 1
        fi

        # Private repositories need authentication for these two remote
        # reads. Command-scoped config disappears with git; neither the token
        # nor a credential-bearing config file enters the Docker context.
        git_remote() {
          local authorization
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" "$@"
        }

        # The authority is the remote's own HEAD, and there is no input that
        # can name it. A declaration the caller supplies could be omitted,
        # defaulted or disagreed with, and each of those is a way for the
        # caller to choose which history counts as reviewed. Whoever may
        # approve a publication is this repository's decision, so the only
        # source is the repository.
        authority=$(git_remote ls-remote --symref origin HEAD \
          | awk '$1 == "ref:" && $3 == "HEAD" { sub("refs/heads/", "", $2); print $2 }')
        if [ -z "$authority" ]; then
          echo "::error::cannot read this repository's default branch from origin; refusing to publish." >&2
          exit 1
        fi

        git_remote fetch --quiet --no-tags --force origin \
          "+refs/heads/${authority}:refs/remotes/origin/${authority}"

        # Fully qualified: a bare `origin/<branch>` is an ambiguous rev that a tag
        # of the same name can win.
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${authority}"; then
          echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not reachable from refs/remotes/origin/${authority}; refusing to publish it." >&2
          echo "Publishing builds this repository's Dockerfile with a registry credential, so the commit has to be one that was merged." >&2
          exit 1
        fi

        # Checkout belongs to the caller now. A proof about the run's SHA
        # must not bless a different tree selected by a caller's ref override.
        if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
          echo "::error::checkout must select the triggering commit ${GITHUB_SHA}; refusing to publish a different tree." >&2
          exit 1
        fi

    # Through the environment, never interpolated into the script: a `run:`
    # built by substituting a caller-supplied string is assembled before any
    # shell sees it, so the string becomes part of the program.
    - name: Validate the inputs
      id: inputs
      env:
        # Kept in sync with resources.ImageRegistry by internal/ciguard.
        REGISTRY: ghcr.io/codefly-dev
        IMAGE_NAME: ${{ inputs.image-name }}
        CALLER_REPOSITORY: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
        LOCK_FILE: ${{ inputs.lock-file }}
        PLATFORMS: ${{ inputs.platforms }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "$IMAGE_NAME" ]; then
          IMAGE_NAME=$(printf '%s' "${CALLER_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
        fi
        if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
          echo "image-name must be a lowercase repository name inside the registry" >&2
          exit 1
        fi
        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "version must be a stable semantic version without a v prefix" >&2
          exit 1
        fi
        if [[ ! "$LOCK_FILE" =~ ^[a-z0-9]+(-[a-z0-9]+)*-image\.json$ ]]; then
          echo "lock-file must be a plain file name of the form <name>-image.json" >&2
          exit 1
        fi
        if [[ ! "$PLATFORMS" =~ ^[a-z0-9]+/[a-z0-9]+(,[a-z0-9]+/[a-z0-9]+)*$ ]]; then
          echo "platforms must be comma-separated os/arch pairs" >&2
          exit 1
        fi
        {
          echo "image=${REGISTRY}/${IMAGE_NAME}"
          echo "version=$VERSION"
        } >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    # The version label is how a release tells this image apart from the one
    # published for an earlier version: both are digests in the same
    # repository, and a lock left unrefreshed would otherwise publish the
    # previous release's bytes under the new tag.
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: build
      with:
        context: .
        platforms: ${{ inputs.platforms }}
        labels: org.opencontainers.image.version=${{ steps.inputs.outputs.version }}
        outputs: type=image,name=${{ steps.inputs.outputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Record the digest
      id: lock
      env:
        IMAGE: ${{ steps.inputs.outputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        LOCK_FILE: ${{ inputs.lock-file }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release-evidence
        jq -n --arg name "$IMAGE" --arg digest "$DIGEST" '{name: $name, digest: $digest}' > "release-evidence/${LOCK_FILE}"
        echo "json=$(jq -c . "release-evidence/${LOCK_FILE}")" >> "$GITHUB_OUTPUT"
        {
          echo "Commit this as \`${LOCK_FILE}\`, then tag the release:"
          echo
          echo '```json'
          cat "release-evidence/${LOCK_FILE}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.lock-file }}-${{ steps.inputs.outputs.version }}
        path: release-evidence/${{ inputs.lock-file }}
        if-no-files-found: error
