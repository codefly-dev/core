name: Publish service image
description: Publish a merged service image by digest and return its release lock.
# This is a STEP in the service's own job: GHCR authorizes that repository.
# The caller checks out the triggering commit with persist-credentials: false,
# grants contents: read and packages: write, gates the job to workflow_dispatch,
# and sets timeout-minutes: 30. Do not run service code before this action.
inputs:
  image-name:
    description: Optional lowercase image name inside core's registry; defaults to the caller repository name.
    default: ''
  version:
    description: Upcoming stable service version without a v prefix.
    required: true
  lock-file:
    description: Plain file name for the release lock, of the form <name>-image.json.
    default: gateway-image.json
  platforms:
    description: Comma-separated os/arch pairs covered by the caller's evidence.
    default: linux/amd64,linux/arm64
  dockerfile:
    description: Tracked relative Dockerfile path inside the clean caller checkout.
    default: Dockerfile
  registry-token:
    description: The caller job's GITHUB_TOKEN with packages write; passed only to registry login.
    required: true
outputs:
  digest:
    description: The sha256 digest of the pushed image index.
    value: ${{ steps.build.outputs.digest }}
  lock:
    description: Compact JSON release lock, also uploaded as an artifact.
    value: ${{ steps.lock.outputs.json }}
runs:
  using: composite
  steps:
    # Only this isolated remote read and registry login receive credentials.
    # Inspecting the checkout happens in a later process with no token in env.
    - name: Resolve the default branch outside the checkout
      id: authority
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
          echo "::error::service images may only be published by workflow_dispatch; refusing to publish." >&2
          exit 1
        fi
        # No checkout or inherited Git configuration is consulted by this step.
        authority_dir=$(mktemp -d "${RUNNER_TEMP}/publisher-authority.XXXXXX")
        trap 'rmdir "$authority_dir"' EXIT
        cd "$authority_dir"
        authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
        remote_head=$(env -i PATH="$PATH" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
          GIT_CEILING_DIRECTORIES="$RUNNER_TEMP" GIT_TERMINAL_PROMPT=0 \
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
          -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${authorization}" \
          ls-remote --symref "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" HEAD)
        authority=$(printf '%s\n' "$remote_head" | awk '$1 == "ref:" && $3 == "HEAD" { print $2 }')
        sha=$(printf '%s\n' "$remote_head" | awk '$2 == "HEAD" && $1 != "ref:" { print $1 }')
        if [[ "$authority" != refs/heads/* ]] || [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::cannot resolve this repository's default branch; refusing to publish." >&2
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: require the commit to be on the default branch, or refuse
      env:
        DEFAULT_BRANCH_SHA: ${{ steps.authority.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
          echo "::error::service images may only be published by workflow_dispatch; refusing to publish." >&2
          exit 1
        fi

        # Inspect only repository configuration. A runner's global/system Git
        # filters must not become executable policy for this checkout.
        export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ATTR_NOSYSTEM=1

        # The SHA comes only from the preceding isolated authority read.
        # Full checkout history is required; a newer remote tip missing locally
        # fails closed. Re-run publication with a fresh checkout in that case.
        if [[ ! "$DEFAULT_BRANCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::invalid default-branch authority; refusing to publish." >&2
          exit 1
        fi
        if ! git -c core.fsmonitor=false -c core.hooksPath=/dev/null merge-base --is-ancestor "$GITHUB_SHA" "$DEFAULT_BRANCH_SHA"; then
          echo "::error::${GITHUB_SHA} is not reachable from the resolved default branch ${DEFAULT_BRANCH_SHA}, or that history is missing locally; refusing to publish." >&2
          exit 1
        fi

        # Never let a checkout credential enter the Docker context, or allow
        # repository helpers, fsmonitor or Git hooks to execute during the guard.
        # Do not print config values: they can contain the credential itself.
        # Includes inherit their scope; command scope must not hide a stored
        # fsmonitor setting. Disable fsmonitor and all Git hooks on every call,
        # including default .git/hooks and configured hooksPath directories.
        effective_config=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null config --list --show-scope --includes)
        local_config=$(printf '%s\n' "$effective_config" | awk '$1 == "local" || $1 == "worktree" { sub(/^[^\t]*\t/, ""); print }')
        if [[ "$local_config" =~ (^|$'\n')(http\.(.*\.)?extraheader=|credential\.|include\.|includeif\.|url\.|core\.(sshcommand|fsmonitor)=|[^=]*\.(token|password)=) ]] ||
           [[ "$local_config" =~ ://[^/[:space:]]*@ ]]; then
          echo "::error::stored credentials or credential indirection, or fsmonitor in local/worktree git config; use persist-credentials: false and remove stored credentials, indirection or fsmonitor settings; hooks are disabled; refusing to publish." >&2
          exit 1
        fi

        # Driver names are arbitrary. Refuse every effective filter definition,
        # including includes and command scope, before status can run one.
        if [[ "$effective_config" =~ (^|$'\n')[^$'\t']+$'\t'(filter\.|core\.attributesfile=) ]]; then
          echo "::error::Git filter drivers and alternate attributes files are unsupported; refusing to publish." >&2
          exit 1
        fi

        # No recorded caller needs submodules. Refuse declarations, gitlinks
        # and retained module metadata, including credentials from old checkouts.
        modules=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse --git-path modules)
        gitlinks=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null ls-files --stage | awk '$1 == "160000" { print }')
        if [ -e .gitmodules ] || [ -L .gitmodules ] || [ -e "$modules" ] || [ -n "$gitlinks" ]; then
          echo "::error::submodules and retained submodule metadata are unsupported; refusing to publish." >&2
          exit 1
        fi

        # Check all in-tree attributes, even ignored/untracked ones, and Git's
        # info/default user attributes. Reject symlinks and unreadable files.
        attribute_list=$(mktemp "${RUNNER_TEMP}/publisher-attributes.XXXXXX")
        trap 'rm -f "$attribute_list"' EXIT
        git -c core.fsmonitor=false -c core.hooksPath=/dev/null ls-files --cached --others -z -- .gitattributes '**/.gitattributes' > "$attribute_list"
        printf '%s\0' "$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse --git-path info/attributes)" "${XDG_CONFIG_HOME:-$HOME/.config}/git/attributes" >> "$attribute_list"
        while IFS= read -r -d '' attributes; do
          if [ -L "$attributes" ]; then
            echo "::error::symlink attributes file; refusing to publish." >&2
            exit 1
          fi
          if [ -e "$attributes" ]; then
            attribute_status=0
            grep -Eq '(^|[[:space:]])filter(=|[[:space:]]|$)' "$attributes" || attribute_status=$?
            if [ "$attribute_status" != 1 ]; then
              echo "::error::filter attributes or unreadable attributes file; refusing to publish." >&2
              exit 1
            fi
          fi
        done < "$attribute_list"

        # These variables are set by GitHub, not action inputs; the effective
        # URL (including rewrites) must still name the caller repository.
        origin=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null remote get-url origin)
        expected_origin="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        if [ "$origin" != "$expected_origin" ] && [ "$origin" != "${expected_origin}.git" ]; then
          echo "::error::origin must be the GitHub repository running this job; refusing to publish." >&2
          exit 1
        fi

        # Checkout belongs to the caller now. A proof about the run's SHA
        # must not bless a different tree selected by a caller's ref override.
        if [ "$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null rev-parse HEAD)" != "$GITHUB_SHA" ]; then
          echo "::error::checkout must select the triggering commit ${GITHUB_SHA}; refusing to publish a different tree." >&2
          exit 1
        fi

        # The build consumes the working tree, not just HEAD. Include ignored
        # files: Docker can copy either into an image. Submodules are refused above.
        # Status trusts these index flags even when the file has changed.
        index_flags=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null ls-files -v)
        if [[ "$index_flags" =~ (^|$'\n')[a-zS][[:space:]] ]]; then
          echo "::error::tracked paths must not use assume-unchanged or skip-worktree; refusing to publish." >&2
          exit 1
        fi
        tree_status=$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null status --porcelain=v1 --untracked-files=all --ignored --ignore-submodules=none)
        if [ -n "$tree_status" ]; then
          echo "::error::build context must be the clean triggering commit, with no modified, staged, untracked or ignored files; refusing to publish." >&2
          exit 1
        fi

    # Through the environment, never interpolated into the script: a `run:`
    # built by substituting a caller-supplied string is assembled before any
    # shell sees it, so the string becomes part of the program.
    - name: Validate the inputs
      id: inputs
      env:
        # Kept in sync with resources.ImageRegistry by internal/ciguard.
        REGISTRY: ghcr.io/codefly-dev
        IMAGE_NAME: ${{ inputs.image-name }}
        CALLER_REPOSITORY: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
        LOCK_FILE: ${{ inputs.lock-file }}
        PLATFORMS: ${{ inputs.platforms }}
        DOCKERFILE: ${{ inputs.dockerfile }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "$IMAGE_NAME" ]; then
          IMAGE_NAME=$(printf '%s' "${CALLER_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
        fi
        if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
          echo "image-name must be a lowercase repository name inside the registry" >&2
          exit 1
        fi
        if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "version must be a stable semantic version without a v prefix" >&2
          exit 1
        fi
        if [[ ! "$LOCK_FILE" =~ ^[a-z0-9]+(-[a-z0-9]+)*-image\.json$ ]]; then
          echo "lock-file must be a plain file name of the form <name>-image.json" >&2
          exit 1
        fi
        if [[ ! "$PLATFORMS" =~ ^[a-z0-9]+/[a-z0-9]+(,[a-z0-9]+/[a-z0-9]+)*$ ]]; then
          echo "platforms must be comma-separated os/arch pairs" >&2
          exit 1
        fi
        if [[ ! "$DOCKERFILE" =~ ^[a-zA-Z0-9_.-]+(/[a-zA-Z0-9_.-]+)*$ ]] ||
           [[ "/$DOCKERFILE/" == *"/../"* ]] || [[ "/$DOCKERFILE/" == *"/./"* ]] ||
           [ ! -f "$DOCKERFILE" ] || [ -L "$DOCKERFILE" ]; then
          echo "dockerfile must be a tracked relative regular file inside the checkout" >&2
          exit 1
        fi
        git -c core.fsmonitor=false -c core.hooksPath=/dev/null ls-files --error-unmatch -- "$DOCKERFILE" > /dev/null
        {
          echo "image=${REGISTRY}/${IMAGE_NAME}"
          echo "version=$VERSION"
        } >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    # The version label is how a release tells this image apart from the one
    # published for an earlier version: both are digests in the same
    # repository, and a lock left unrefreshed would otherwise publish the
    # previous release's bytes under the new tag.
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: build
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        labels: org.opencontainers.image.version=${{ steps.inputs.outputs.version }}
        outputs: type=image,name=${{ steps.inputs.outputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Record the digest
      id: lock
      env:
        IMAGE: ${{ steps.inputs.outputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        LOCK_FILE: ${{ inputs.lock-file }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release-evidence
        jq -n --arg name "$IMAGE" --arg digest "$DIGEST" '{name: $name, digest: $digest}' > "release-evidence/${LOCK_FILE}"
        echo "json=$(jq -c . "release-evidence/${LOCK_FILE}")" >> "$GITHUB_OUTPUT"
        {
          echo "Commit this as \`${LOCK_FILE}\`, then tag the release:"
          echo
          echo '```json'
          cat "release-evidence/${LOCK_FILE}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.lock-file }}-${{ steps.inputs.outputs.version }}
        path: release-evidence/${{ inputs.lock-file }}
        if-no-files-found: error
