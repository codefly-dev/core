syntax = "proto3";

package codefly.cli.v0;

import "codefly/base/v0/network.proto";
import "codefly/base/v0/workspace.proto";
import "codefly/base/v0/configuration.proto";
import "codefly/base/v0/readiness.proto";

import "codefly/services/agent/v0/agent.proto";

import "codefly/observability/v0/dependencies.proto";
import "codefly/observability/v0/logs.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";


/* Overall information */


// GetAgentInformationRequest identifies an installed agent to inspect.
message GetAgentInformationRequest {
  // agent is the agent name or reference, such as go-grpc or nextjs.
  string agent = 1;
}

// MultiGraphResponse contains multiple architecture graphs returned by one CLI endpoint.
message MultiGraphResponse {
  // graphs are architecture graphs, usually grouped by public module boundary.
  repeated codefly.observability.v0.GraphResponse graphs = 1;
}

/* Active information
*/

// ActiveResponse reports the workspace/module/service context selected by the CLI.
message ActiveResponse {
  // workspace is the Codefly workspace name that scopes modules and services.
  string workspace = 1;
  // module is the Codefly module name that groups services.
  string module = 2;
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 3;
}

// RunningInformation reports an active service and the agent process handling it.
message RunningInformation {
  // module is the Codefly module name that groups services.
  string module = 1;
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 2;
  // agent_pid is the operating-system process id of the agent process.
  int32 agent_pid = 3;
}

// GetAddressRequest identifies the concrete address for one service endpoint.
message GetAddressRequest {
  // module is the Codefly module name that groups services.
  string module = 1;
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 2;
  // endpoint is the logical endpoint name declared by a service.
  string endpoint = 3;
}

// GetAddressResponse returns the address selected for the caller's runtime context.
message GetAddressResponse {
  // address is the concrete host or URL callers should use.
  string address = 1;
}

// GetNetworkMappingsRequest identifies a service whose network mappings should be returned.
message GetNetworkMappingsRequest {
  // module is the Codefly module name that groups services.
  string module = 1;
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 2;
}

// GetNetworkMappingsResponse returns concrete network instances for a service's endpoints.
message GetNetworkMappingsResponse {
  // network_mappings map logical endpoints to concrete network instances.
  repeated codefly.base.v0.NetworkMapping network_mappings = 1;
}


// GetConfigurationRequest identifies service-scoped configuration in the active workspace.
message GetConfigurationRequest {
  // module is the Codefly module name that groups services.
  string module = 1;
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 2;
}

// GetConfigurationResponse returns the configuration declared by a service.
message GetConfigurationResponse {
  // configuration is the service or workspace configuration payload.
  codefly.base.v0.Configuration configuration = 1;
  // process_variables are values the orchestrator installs into the caller's
  // process under exactly these names. Configuration reaches a process under a
  // key the SDK derives (CODEFLY__SERVICE_CONFIGURATION__<UNIQUE>__…), which
  // cannot satisfy a wire contract a runtime reads by its own fixed name; these
  // are projected verbatim instead.
  repeated codefly.base.v0.ConfigurationValue process_variables = 2;
}


// GetConfigurationsResponse returns multiple configuration payloads for dependency/runtime flows.
message GetConfigurationsResponse {
  // configurations are configuration payloads exposed to a service.
  repeated codefly.base.v0.Configuration configurations = 1;
}

// SessionHandshakeRequest asks the control server to prove it is the dependency
// session the caller owns.
message SessionHandshakeRequest {
  // session_id is the invocation identity the caller minted for this session.
  string session_id = 1;
  // challenge is a fresh caller-generated nonce the server must sign.
  string challenge = 2;
  // protocol_version is the session contract version the caller speaks.
  uint32 protocol_version = 3;
}

// SessionHandshakeResponse carries the server's proof of session ownership.
message SessionHandshakeResponse {
  // session_id is the invocation identity the server was started with.
  string session_id = 1;
  // proof signs the challenge with the session secret shared through the
  // private child environment. A server that does not hold the secret cannot
  // produce it.
  string proof = 2;
  // protocol_version is the session contract version the server speaks.
  uint32 protocol_version = 3;
  // capabilities are optional isolation guarantees the server implements,
  // such as isolated-control-socket.
  repeated string capabilities = 4;
}

// ServiceLifecycle names the stage a dependency has reached on its way to
// ready. Acquiring an image is a stage of its own because it stalls for
// reasons that have nothing to do with booting — a cold registry, a rebuild —
// and a caller reporting a readiness overrun has to say which one it waited
// on.
enum ServiceLifecycle {
  // SERVICE_LIFECYCLE_UNSPECIFIED is the default when the stage is unreported,
  // which is what an orchestrator predating per-service status sends.
  SERVICE_LIFECYCLE_UNSPECIFIED = 0;
  // SERVICE_LIFECYCLE_PENDING means the service is planned but not started,
  // usually because a dependency of its own is still starting.
  SERVICE_LIFECYCLE_PENDING = 1;
  // SERVICE_LIFECYCLE_ACQUIRING_IMAGE means an image is being pulled or built.
  SERVICE_LIFECYCLE_ACQUIRING_IMAGE = 2;
  // SERVICE_LIFECYCLE_STARTING means the workload was launched and its
  // readiness predicate does not hold yet.
  SERVICE_LIFECYCLE_STARTING = 3;
  // SERVICE_LIFECYCLE_READY means the declared readiness predicate holds.
  SERVICE_LIFECYCLE_READY = 4;
  // SERVICE_LIFECYCLE_FAILED means the service will not become ready without
  // intervention, so a caller waiting on it should stop rather than spend the
  // rest of its budget.
  SERVICE_LIFECYCLE_FAILED = 5;
}

// ServiceReadiness is one dependency's contribution to flow readiness, named
// so that a caller whose flow overran its budget can charge the wait to a
// service instead of reporting an aggregate.
message ServiceReadiness {
  // service is the module/service unique of the dependency.
  string service = 1;
  // lifecycle is the stage the service has reached. It is the whole truth
  // about whether this service is ready: there is no separate ready flag to
  // contradict it.
  ServiceLifecycle lifecycle = 2;
  // entered_at is when the service entered lifecycle, so a caller charges
  // elapsed time to the stage that actually consumed it rather than to the
  // resolution of its own poll loop.
  google.protobuf.Timestamp entered_at = 3;
  // health is the last readiness evaluation, which names the predicate that
  // has not held yet. Absent for a service that has not been probed.
  codefly.base.v0.HealthReport health = 4;
  // message carries diagnostics for the current stage, such as the image being
  // pulled or why a start failed.
  string message = 5;
}

// FlowStatus reports whether the current orchestration flow is ready.
message FlowStatus {
  // ready is true when the flow or service has reached an operable state.
  bool ready = 1;
  // services is the per-dependency view behind ready. An orchestrator that
  // reports nothing here leaves a caller with the aggregate verdict alone.
  repeated ServiceReadiness services = 2;
}

// StopFlowRequest asks the CLI to stop the active orchestration flow.
message StopFlowRequest {
}

// StopFlowResponse acknowledges that the active flow stop request was accepted.
message StopFlowResponse {
}

// DestroyFlowRequest asks the CLI to destroy resources owned by the active flow.
message DestroyFlowRequest {
}

// DestroyFlowResponse acknowledges that destroy flow cleanup was requested.
message DestroyFlowResponse {
}

// CLI exposes the local Codefly command bridge used by companion UIs and integrations.
service CLI {

  // Ping checks that the CLI bridge is reachable.
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      get: "/ping"
    };
  }

  // SessionHandshake proves that this control server belongs to the dependency
  // session the caller started. It carries no HTTP annotation: session proofs
  // must not be reachable through the CLI's REST companion.
  rpc SessionHandshake(SessionHandshakeRequest) returns (SessionHandshakeResponse) {
  }

  /* Overall information
  */

  // GetAgentInformation returns metadata and documentation for an installed agent.
  rpc GetAgentInformation(GetAgentInformationRequest) returns (codefly.services.agent.v0.AgentInformation) {
    option (google.api.http) = {
      get: "/agent/{agent}/information"
    };
  }


  // GetWorkspaceInventory returns the loaded workspace resource tree.
  rpc GetWorkspaceInventory(google.protobuf.Empty) returns (codefly.base.v0.Workspace) {
    option (google.api.http) = {
      get: "/workspace/inventory"
    };
  }

  // GetWorkspaceServiceDependencyGraph returns the service dependency DAG for the workspace.
  rpc GetWorkspaceServiceDependencyGraph(google.protobuf.Empty) returns (codefly.observability.v0.GraphResponse) {
    option (google.api.http) = {
      get: "/workspace/service-dependency-graph"
    };
  }

  // GetWorkspacePublicModulesDependencyGraph returns graphs of public module-facing endpoints.
  rpc GetWorkspacePublicModulesDependencyGraph(google.protobuf.Empty) returns (MultiGraphResponse) {
    option (google.api.http) = {
      get: "/workspace/public-endpoints-graph"
    };
  }

  // GetActive returns the CLI's current workspace/module/service selection.
  rpc GetActive(google.protobuf.Empty) returns (ActiveResponse) {
    option (google.api.http) = {
      get: "/workspace/information"
    };
  }


  // GetAddresses returns the concrete address for a service endpoint.
  rpc GetAddresses(GetAddressRequest) returns (GetAddressResponse) {
    option (google.api.http) = {
      get: "/workspace/network-mapping/{module}/{service}/{endpoint}"
    };
  }

  // GetConfiguration returns configuration declared by the target service.
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse) {
    option (google.api.http) = {
      get: "/workspace/configuration/{module}/{service}"
    };
  }

  // GetDependenciesConfigurations returns configuration exposed by upstream services.
  rpc GetDependenciesConfigurations(GetConfigurationRequest) returns (GetConfigurationsResponse) {
    option (google.api.http) = {
      get: "/workspace/dependencies-configurations/{module}/{service}"
    };
  }

  // GetDependenciesNetworkMappings returns network mappings exposed by upstream services.
  rpc GetDependenciesNetworkMappings(GetNetworkMappingsRequest) returns (GetNetworkMappingsResponse) {
    option (google.api.http) = {
      get: "/workspace/dependencies-network-mappings/{module}/{service}"
    };
  }

  // GetRuntimeConfigurations returns configuration produced by a running service.
  rpc GetRuntimeConfigurations(GetConfigurationRequest) returns (GetConfigurationsResponse) {
    option (google.api.http) = {
      get: "/workspace/runtime-configurations/{module}/{service}"
    };
  }

  // Logs streams live workspace log events.
  rpc Logs(google.protobuf.Empty)  returns (stream observability.v0.Log) {
    option (google.api.http) = {
      get: "/workspace/logs"
    };
  }

  // ActiveLogHistory returns persisted log events for the active workspace session.
  rpc ActiveLogHistory(codefly.observability.v0.LogRequest) returns (codefly.observability.v0.LogResponse) {
    option (google.api.http) = {
      get: "/workspace/logs/history"
    };
  }

  // GetFlowStatus reports readiness for the active orchestration flow.
  rpc GetFlowStatus(google.protobuf.Empty) returns (FlowStatus) {
    option (google.api.http) = {
      get: "/workspace/flow/status"
    };
  }

  // StopFlow stops the active orchestration flow.
  rpc StopFlow(StopFlowRequest) returns (StopFlowResponse) {
    option (google.api.http) = {
      post: "/workspace/flow/stop"
    };
  }


  // DestroyFlow tears down resources owned by the active orchestration flow.
  rpc DestroyFlow(DestroyFlowRequest) returns (DestroyFlowResponse) {
    option (google.api.http) = {
      post: "/workspace/flow/destroy"
    };
  }
}
