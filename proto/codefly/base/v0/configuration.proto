syntax = "proto3";
package codefly.base.v0;

import "codefly/base/v0/scope.proto";

// ConfigurationValue is one key/value pair produced by a service or workspace configuration
// source.
message ConfigurationValue {
  // key is the configuration or schema property name.
  string key = 1;
  // value is the configuration or schema value.
  string value = 2;
  // secret marks configuration values that must not be logged or displayed.
  bool secret = 3;
  // template, set only on a secret value that carries no value, declares how
  // the value is assembled from the producer's own secret configuration values
  // wherever it is delivered. A render that must not carry secrets delivers the
  // assembly instead of asking an operator to store the assembled value, so the
  // secret store holds only the referenced primitives.
  ConfigurationValueTemplate template = 4;
}

// ConfigurationValueTemplate assembles a value by concatenating its segments in
// order. It is engine-neutral: a renderer translates it into whatever evaluates
// it where the value is delivered, and resources.EvaluateConfigurationValueTemplate
// is the reference semantics every translation must reproduce byte for byte.
message ConfigurationValueTemplate {
  // segments are concatenated in order.
  repeated ConfigurationValueTemplateSegment segments = 1;
}

// ConfigurationValueTemplateSegment is one piece of a template: a literal, or a
// reference to one of the producer's own secret configuration values.
message ConfigurationValueTemplateSegment {
  // content is the literal text or the referenced value of this segment.
  oneof content {
    // literal is copied verbatim. It may not contain "{{" or "}}": a renderer
    // translating a template into a text/template engine makes the literals the
    // template source, and a literal carrying those delimiters cannot be
    // reproduced there byte for byte.
    string literal = 1;
    // reference is replaced by the referenced value, encoded by its escape.
    ConfigurationValueReference reference = 2;
  }
}

// ConfigurationValueReference names one secret configuration value of the
// producer that declares the template — never another service's. The reference
// is resolved against the declaring producer's own configuration, matching the
// group name and key the way every other configuration lookup does: case
// insensitively, with "-" and "_" equivalent. resources.ProducerConfigurationValueLookup
// is that resolution, and a renderer that resolves references any other way does
// not reproduce the reference semantics.
message ConfigurationValueReference {
  // configuration is the name of the producer's configuration group.
  string configuration = 1;
  // key is the key of the value within that group.
  string key = 2;
  // escape is how the value is encoded before it is inserted. It must be stated:
  // a reference that leaves it unspecified is rejected rather than inserted
  // verbatim, because verbatim insertion into a URL lets a value containing "@"
  // or "/" move the host the assembled value points at.
  ConfigurationValueEscape escape = 3;
}

// ConfigurationValueEscape is how a referenced value is encoded.
enum ConfigurationValueEscape {
  // CONFIGURATION_VALUE_ESCAPE_UNSPECIFIED means the producer stated no
  // encoding. It is never treated as an encoding: a reference carrying it is
  // rejected, so forgetting the field cannot silently insert a value verbatim.
  CONFIGURATION_VALUE_ESCAPE_UNSPECIFIED = 0;
  // CONFIGURATION_VALUE_ESCAPE_NONE inserts the value verbatim. It is the
  // explicit choice for a value assembled into a context with no delimiters.
  CONFIGURATION_VALUE_ESCAPE_NONE = 1;
  // CONFIGURATION_VALUE_ESCAPE_URL_USERINFO percent-encodes every byte except
  // ASCII letters, digits and "-", ".", "_", "~" (RFC 3986 unreserved), so the
  // value is safe inside the userinfo, path or query of a URL.
  CONFIGURATION_VALUE_ESCAPE_URL_USERINFO = 2;
}

// ConfigurationData carries a structured configuration blob alongside key/value configuration.
message ConfigurationData {
  // kind identifies the format or producer-specific type of this configuration blob.
  string kind = 1;
  // content is the full file, resource, prompt, or response body.
  bytes content = 2;
  // secret marks configuration values that must not be logged or displayed.
  bool secret = 3;
}

// ConfigurationInformation groups named configuration values produced by a service or workspace.
message ConfigurationInformation {
  // name is the configuration group name.
  string name = 1;
  // configuration_values are key/value pairs exposed by a configuration entry.
  repeated ConfigurationValue configuration_values = 2;
  // data is an optional structured configuration payload for values that do not fit key/value pairs.
  ConfigurationData data = 3;
}

// Configuration can come from
// - workspace: origin is _workspace
// - service: origin is the service unique
// Information is a grouping of configuration values
message Configuration {
  // origin identifies the service or workspace that produced the configuration.
  string origin = 1;
  // runtime_context describes where the service runs, such as native, nix, container, or free.
  RuntimeContext runtime_context = 2;
  // infos are named configuration groups exposed by a producer.
  repeated ConfigurationInformation infos = 3;
}
