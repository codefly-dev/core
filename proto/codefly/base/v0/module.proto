syntax = "proto3";
package codefly.base.v0;

import "buf/validate/validate.proto";

import "codefly/base/v0/service.proto";
import "codefly/base/v0/agent.proto";

// InterfaceEndpoint declares a single endpoint exposed by the module.
message InterfaceEndpoint {
  // The entry is the whole export declaration: an "internal" export names the
  // modules it exports to (an export to nobody is refused), and a "public" one
  // lists none (nothing reads it). The same rule the loader enforces.
  option (buf.validate.message).cel = {
    id: "interface_endpoint.allow_modules_match_visibility"
    message: "an internal export names its allow_modules; a public export lists none"
    expression: "this.visibility == 'internal' ? this.allow_modules.size() > 0 : this.allow_modules.size() == 0"
  };
  // The service that owns this endpoint
  string service = 1;
  // The endpoint name within the service
  string endpoint = 2;
  // visibility is what the module grants across its boundary for this
  // endpoint: "public", or "internal" to the modules allow_modules names.
  string visibility = 3 [(buf.validate.field).string.in = "public", (buf.validate.field).string.in = "internal"];
  // allow_modules names the modules an "internal" export may be reached from
  // ("*" for every module).
  repeated string allow_modules = 4;
}

// ModuleInterface is the formal contract of what a module exposes.
message ModuleInterface {
  // endpoints are service endpoints that form the module's public contract.
  repeated InterfaceEndpoint endpoints = 1;
}

// Module is a core Codefly resource in the workspace hierarchy.
message Module {
  // The name of the module
  string name = 1;
  // A description of the module
  string description = 2;
  // Services that are provided by this module
  repeated Service services = 4;
  // (Optional) The entry point for the module
  string service_entry = 5;
  // (Optional) The formal interface contract
  ModuleInterface interface = 6;
  // (Optional) The agent that created this module (for templated modules)
  Agent agent = 7;
}

// ManagedModule is the platform-managed representation of a module.
message ManagedModule {
  // id is the stable identifier for this record.
  string id = 1 [(buf.validate.field).string.pattern = "^[a-z]{10}$"];
  // module is the full module resource.
  Module module = 2;
}
