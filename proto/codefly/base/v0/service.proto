syntax = "proto3";
package codefly.base.v0;

import "buf/validate/validate.proto";
import "codefly/base/v0/endpoint.proto";
import "codefly/base/v0/agent.proto";


// ServiceReference points to another service, usually as a dependency.
message ServiceReference {
  // name is the referenced service name.
  string name = 1  [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 50];
  // module is the Codefly module name that groups services.
  string module = 2  [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 50];
}

// Service is the fundamental "live" computing unit of a system
// It belongs to a module
// It is "hosted" by an agent
// It has a set of endpoints
message Service {
  // Name of the service
  string name = 1  [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 50];
  // Short description of the service
  string description = 2;
  // Agent that represents the service
  Agent agent = 3;
  // Endpoints exposed by the service
  repeated Endpoint endpoints = 4;
  // Dependencies
  repeated ServiceReference service_dependencies = 5;
}


// Version carries the version reported by an agent or resource descriptor.
message Version {
  // version is the semantic or service-specific version for this resource.
  string version = 1;
}

// ServiceIdentity is the identity of a service in a workspace
message ServiceIdentity {
  // name is the service name.
  string name = 1  [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 50];
  // module is the Codefly module name that groups services.
  string module = 2  [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 50];
  // workspace is the Codefly workspace name that scopes modules and services.
  string workspace = 3  [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 50];
  // version is the semantic or service-specific version for this resource.
  string version = 4 [(buf.validate.field).string.min_len = 3, (buf.validate.field).string.max_len = 10];
  // workspace_path is the absolute or caller-known path to the workspace root.
  string workspace_path = 5 [(buf.validate.field).string.min_len = 3];
  // relative_to_workspace is the path to the service relative to the workspace root.
  string relative_to_workspace = 6 [(buf.validate.field).string.min_len = 3];
  // interface_bindings is how the host's composition bound the service's
  // interface dependencies. Present, it is authoritative: the agent applies it
  // and never loads the workspace to bind them itself, because only the host
  // resolves a composition that imports other workspaces. Absent (an older
  // host), the agent binds against the workspace at workspace_path.
  ServiceInterfaceBindings interface_bindings = 7;
}

// ServiceInterfaceBindings is the host's binding of a service's interface
// dependencies. A requirement with no entry is unbound: nothing in the
// composition implements it.
message ServiceInterfaceBindings {
  // bindings holds one entry per interface-only dependency the host bound.
  repeated ServiceInterfaceBinding bindings = 1;
}

// ServiceInterfaceBinding is the provider one interface dependency is bound to.
message ServiceInterfaceBinding {
  // interface is the requirement as the service declares it,
  // <publisher>/<name>@<range>.
  string interface = 1 [(buf.validate.field).string.min_len = 3];
  // module is the module of the providing service.
  string module = 2 [(buf.validate.field).string.min_len = 1];
  // service is the providing service.
  string service = 3 [(buf.validate.field).string.min_len = 1];
  // endpoint is the provider's endpoint implementing the interface, empty when
  // the service implements it as a capability.
  string endpoint = 4;
}
