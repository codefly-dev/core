syntax = "proto3";
package mind.gateway.v1;

import "codefly/base/v0/source.proto";
import "codefly/services/builder/v0/builder.proto";
import "codefly/services/runtime/v0/runtime.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/codefly-dev/core/generated/go/mind/gateway/v1;gatewayv1";

// Gateway is the ONLY service Mind talks to.
// Codefly CLI implements it. Everything else is behind this wall.
//
// Mind sees: services, files, build results, check results, dependencies,
// git state, and command output.
// Mind never sees: agents, processes, containers, addresses.

// Gateway is the firewall API Mind uses to reach Codefly workspaces without talking directly to
// agents, processes, or containers.
service Gateway {
  // ─── Topology ───────────────────────────────────────────────

  // ListServices returns all services known to the gateway.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);

  // ─── File Operations ────────────────────────────────────────

  // ReadFile reads a file from a service's source tree.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile writes (creates or overwrites) a file in a service's source tree.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);

  // ListFiles lists files in a service's source tree.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // SubscribeWorkspaceChanges streams metadata-only filesystem wakeups from
  // the Codefly execution boundary. Events are sequenced and replayable over a
  // bounded window; consumers must still reconcile with authoritative reads.
  rpc SubscribeWorkspaceChanges(SubscribeWorkspaceChangesRequest) returns (stream WorkspaceChangeEvent);

  // DeleteFile removes a file from a service's source tree.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // MoveFile renames or moves a file, optionally updating imports.
  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse);

  // CreateFile creates a new file (fails if exists unless overwrite set).
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);

  // ─── Code Editing ───────────────────────────────────────────

  // Fix runs language-specific fixers on a file (goimports, gofmt, prettier, etc.).
  rpc Fix(FixRequest) returns (FixResponse);

  // ApplyEdit performs a smart FIND/REPLACE on a file.
  rpc ApplyEdit(ApplyEditRequest) returns (ApplyEditResponse);

  // BatchApplyEdits applies multiple edits atomically across files/services.
  rpc BatchApplyEdits(BatchApplyEditsRequest) returns (BatchApplyEditsResponse);

  // ConfigureMutationAuthority pins the SaaS coordinator verification key and
  // this gateway's workspace identity before prepared mutations are allowed.
  rpc ConfigureMutationAuthority(ConfigureMutationAuthorityRequest) returns (ConfigureMutationAuthorityResponse);

  // PrepareMutation resolves one proposed edit against current project bytes
  // without writing them and seals the exact result behind a content digest.
  rpc PrepareMutation(PrepareMutationRequest) returns (PrepareMutationResponse);

  // ApplyPreparedMutation verifies the prepared digest, current resource
  // preconditions, and a coordinator-signed fenced permit before one write.
  rpc ApplyPreparedMutation(ApplyPreparedMutationRequest) returns (ApplyPreparedMutationResponse);

  // ─── Search ─────────────────────────────────────────────────

  // Search performs text search across a service's source tree.
  rpc Search(SearchRequest) returns (SearchResponse);

  // ─── Build / Lint / Test ────────────────────────────────────

  // Build compiles the service (and its dependencies if needed).
  rpc Build(BuildRequest) returns (BuildResponse);

  // Lint runs the configured lint command on the service.
  rpc Lint(LintRequest) returns (LintResponse);

  // Test runs the configured test command on the service.
  rpc Test(TestRequest) returns (TestResponse);

  // ConfigureService applies plugin-owned, schema-validated configuration.
  // Mind supplies typed values; the owning Codefly agent decides how and
  // where they are persisted.
  rpc ConfigureService(ConfigureServiceRequest) returns (ConfigureServiceResponse);

  // Format applies the service plugin's canonical formatter/import organizer.
  rpc Format(FormatRequest) returns (FormatResponse);

  // ─── Execution ──────────────────────────────────────────────

  // RunCommand executes an arbitrary command in the service context.
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);

  // ─── Plugin Commands ──────────────────────────────────────

  // ListAllCommands returns commands from all loaded plugins plus built-in ones.
  rpc ListAllCommands(ListAllCommandsRequest) returns (ListAllCommandsResponse);

  // ─── Runtime / Checks ───────────────────────────────────────

  // RunChecks executes a set of verification checks against the service.
  rpc RunChecks(RunChecksRequest) returns (RunChecksResponse);

  // ─── Version Control ────────────────────────────────────────

  // GitStatus returns the current git status of modified/staged/untracked files.
  rpc GitStatus(GitStatusRequest) returns (GitStatusResponse);

  // GitDiff shows changes (unstaged or staged).
  rpc GitDiff(GitDiffRequest) returns (GitDiffResponse);

  // GitLog returns recent commit history.
  rpc GitLog(GitLogRequest) returns (GitLogResponse);

  // GitCommit commits staged changes.
  rpc GitCommit(GitCommitRequest) returns (GitCommitResponse);

  // GitBranch creates a branch at an explicit start point.
  rpc GitBranch(GitBranchRequest) returns (GitBranchResponse);

  // GitCheckout switches the worktree to an existing branch or revision.
  rpc GitCheckout(GitCheckoutRequest) returns (GitCheckoutResponse);

  // GitPush publishes a local branch to a remote.
  rpc GitPush(GitPushRequest) returns (GitPushResponse);

  // GitTag creates an annotated or signed tag.
  rpc GitTag(GitTagRequest) returns (GitTagResponse);

  // GitMerge merges one revision into the checked-out branch.
  rpc GitMerge(GitMergeRequest) returns (GitMergeResponse);

  // GitRevert creates a commit that reverts one revision.
  rpc GitRevert(GitRevertRequest) returns (GitRevertResponse);

  // MaterializeRepositorySnapshot resolves one remote revision into a
  // detached, immutable worktree owned by the caller's service-state cache.
  // Codefly owns every Git command and credential/configuration boundary.
  rpc MaterializeRepositorySnapshot(MaterializeRepositorySnapshotRequest) returns (MaterializeRepositorySnapshotResponse);

  // PrepareRepositoryCheckout resolves one remote revision into a clean,
  // mutable checkout backed by a caller-owned repository cache directory.
  rpc PrepareRepositoryCheckout(PrepareRepositoryCheckoutRequest) returns (PrepareRepositoryCheckoutResponse);

  // ReleaseRepositorySnapshot removes a detached worktree previously leased
  // by MaterializeRepositorySnapshot and prunes its repository metadata.
  rpc ReleaseRepositorySnapshot(ReleaseRepositorySnapshotRequest) returns (ReleaseRepositorySnapshotResponse);

  // Release bumps the code unit versions, commits them, creates a signed tag,
  // and publishes the commit and tag as one semantic operation.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);

  // ─── Forge ───────────────────────────────────────────────────

  // ForgePullRequestStatus returns one vendor-neutral PR/check/review snapshot.
  rpc ForgePullRequestStatus(ForgePullRequestStatusRequest) returns (ForgePullRequestStatusResponse);

  // ForgeMergePullRequest merges a PR after enforcing its requested check policy.
  rpc ForgeMergePullRequest(ForgeMergePullRequestRequest) returns (ForgeMergePullRequestResponse);

  // ForgeRequestReview requests reviewers on a PR.
  rpc ForgeRequestReview(ForgeRequestReviewRequest) returns (ForgeRequestReviewResponse);

  // ForgeNormalizeWebhook verifies and normalizes one provider webhook.
  rpc ForgeNormalizeWebhook(ForgeNormalizeWebhookRequest) returns (ForgeNormalizeWebhookResponse);

  // ─── Dependency Management ──────────────────────────────────

  // ListDependencies returns all dependencies with versions.
  rpc ListDependencies(ListDependenciesRequest) returns (ListDependenciesResponse);

  // AddDependency adds a package via the language package manager.
  rpc AddDependency(AddDependencyRequest) returns (AddDependencyResponse);

  // RemoveDependency removes a package via the language package manager.
  rpc RemoveDependency(RemoveDependencyRequest) returns (RemoveDependencyResponse);

  // ─── Project Analysis ──────────────────────────────────────

  // GetProjectInfo returns rich project metadata: module, packages, deps, file hashes.
  rpc GetProjectInfo(GetProjectInfoRequest) returns (GetProjectInfoResponse);

  // DiscoverCodeUnits returns Codefly-owned structural source boundaries,
  // including unsupported ecosystems that bind to the generic agent.
  rpc DiscoverCodeUnits(DiscoverCodeUnitsRequest) returns (DiscoverCodeUnitsResponse);

  // ─── Terminal ───────────────────────────────────────────────
  // The gateway runs INSIDE the execution box, so the PTY lives here — the one
  // place with the worktree + shell. Mind proxies these to give users an
  // interactive terminal in the session's working directory. Mind owns the
  // scrollback/session state; the gateway owns the live PTY.

  // OpenTerminal spawns a PTY-backed shell in the gateway's working directory.
  rpc OpenTerminal(OpenTerminalRequest) returns (OpenTerminalResponse);

  // AttachTerminal is a bidirectional stream: client input bytes in,
  // raw PTY output bytes out, until the shell exits or the client detaches.
  rpc AttachTerminal(stream TerminalInput) returns (stream TerminalOutput);

  // ResizeTerminal changes the PTY window size (rows/cols).
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse);

  // CloseTerminal kills the PTY + child process.
  rpc CloseTerminal(CloseTerminalRequest) returns (CloseTerminalResponse);

  // ListTerminals lists the open terminals in this gateway.
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse);
}

// ─── Topology ────────────────────────────────────────────────

// ListServicesRequest carries optional filters for listing services.
message ListServicesRequest {}

// ServiceInfo describes a service visible through the gateway.
message ServiceInfo {
  // name is the Codefly service name.
  string name = 1;
  // language is the implementation language detected for the service.
  string language = 2; // "go", "rust", "node", etc.
  // type distinguishes services, libraries, and other service-like resources.
  string type = 3; // "library" | "service"
  // port is the primary local port exposed through the gateway when known.
  int32 port = 7;
}

// ListServicesResponse returns the services the gateway can route to.
message ListServicesResponse {
  // services are known Codefly services and libraries in the workspace.
  repeated ServiceInfo services = 1;
}

// ─── File Operations ─────────────────────────────────────────

// ReadFileRequest identifies a file to read from one service source tree.
message ReadFileRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // path is a workspace- or service-relative filesystem path.
  string path = 2; // relative to service root
}

// ReadFileResponse returns file content when the requested path exists.
message ReadFileResponse {
  // content is the complete file body; it is empty when exists is false.
  string content = 1;
  // exists reports whether the requested file or resource was found.
  bool exists = 2;
}

// WriteFileRequest replaces or creates one file in a service source tree.
message WriteFileRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // path is a workspace- or service-relative filesystem path.
  string path = 2; // relative to service root
  // content is the complete file body to write.
  string content = 3;
}

// WriteFileResponse reports whether the gateway completed the write.
message WriteFileResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
}

// ListFilesRequest carries optional filters for listing files.
message ListFilesRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // path is a workspace- or service-relative filesystem path.
  string path = 2; // optional: subdirectory (empty = root)
  // extensions restrict file results to the listed suffixes.
  repeated string extensions = 3; // optional: filter by extension (e.g. ".go", ".py")
  // recursive includes nested directories when true.
  bool recursive = 4;
}

// FileInfo describes a file or directory returned by ListFiles.
message FileInfo {
  // path is a workspace- or service-relative filesystem path.
  string path = 1; // relative path within the service
  // size_bytes is the file size in bytes.
  int64 size_bytes = 2;
  // is_directory is true when the path is a directory.
  bool is_directory = 3;
}

// ListFilesResponse returns file metadata for paths matching the request filters.
message ListFilesResponse {
  // files are files or directories under the requested service path.
  repeated FileInfo files = 1;
}

// WorkspaceChangeOperation describes why a repository path may have changed.
// RESCAN is an explicit uncertainty marker (watch overflow, replay gap, or a
// directory-level change) and requires an authoritative manifest pull.
enum WorkspaceChangeOperation {
  WORKSPACE_CHANGE_OPERATION_UNSPECIFIED = 0;
  WORKSPACE_CHANGE_OPERATION_CREATE = 1;
  WORKSPACE_CHANGE_OPERATION_WRITE = 2;
  WORKSPACE_CHANGE_OPERATION_REMOVE = 3;
  WORKSPACE_CHANGE_OPERATION_METADATA = 4;
  WORKSPACE_CHANGE_OPERATION_RESCAN = 5;
}

// WorkspaceChangeCursor resumes one monitor epoch after an acknowledged
// sequence. Both fields are required together; an empty cursor first emits an
// explicit rescan because the consumer cannot prove prior completeness.
message WorkspaceChangeCursor {
  string source_id = 1;
  uint64 sequence = 2;
}

message SubscribeWorkspaceChangesRequest {
  string service = 1;
  WorkspaceChangeCursor after = 2;
}

// WorkspaceChange contains metadata only. Source bytes remain behind ReadFile
// and version-aware Gateway operations.
message WorkspaceChange {
  WorkspaceChangeOperation operation = 1;
  string path = 2;
  string previous_path = 3;
  string reason = 4;
}

// WorkspaceChangeEvent is one durable watcher cursor position. Current
// producers emit one canonical change per position so downstream journals can
// acknowledge it atomically; consumers must treat any future batch atomically.
message WorkspaceChangeEvent {
  string source_id = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp observed_at = 3;
  repeated WorkspaceChange changes = 4;
}

// DeleteFileRequest identifies the file resource to delete.
message DeleteFileRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // path is a workspace- or service-relative filesystem path.
  string path = 2; // relative to service root
}

// DeleteFileResponse reports whether the gateway removed the file.
message DeleteFileResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
}

// MoveFileRequest renames or moves a file within one service tree.
message MoveFileRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // old_path is the current service-relative path before a move.
  string old_path = 2;
  // new_path is the desired service-relative path after a move.
  string new_path = 3;
  // update_imports asks the language tooling to rewrite imports after a move.
  bool update_imports = 4;
}

// MoveFileResponse reports the move and any files rewritten because imports changed.
message MoveFileResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
  // updated_files lists files changed as a side effect of import rewriting.
  repeated string updated_files = 3;
}

// CreateFileRequest describes the file resource to create.
message CreateFileRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // path is a workspace- or service-relative filesystem path.
  string path = 2;
  // content is the initial file body to write.
  string content = 3;
  // overwrite allows CreateFile to replace an existing file when true.
  bool overwrite = 4;
}

// CreateFileResponse reports whether the gateway created the file.
message CreateFileResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
}

// ─── Code Fix ─────────────────────────────────────────────────

// FixRequest asks the gateway to run language-specific formatters or fixers on a file.
message FixRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // path is a workspace- or service-relative filesystem path.
  string path = 2; // relative to service root
  // mode selects safe fixes, no fixes, or explicitly aggressive fixes.
  codefly.base.v0.FixMode mode = 3;
  // dry_run returns the fixed content and evidence without writing the file.
  bool dry_run = 4;
}

// FixResponse returns the fixed content and the formatter actions that ran.
message FixResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // content is the fixed file content; it may be empty when no rewrite was needed.
  string content = 2; // the fixed file content (empty if unchanged)
  // error explains why the operation failed; empty means success at this layer.
  string error = 3; // non-fatal: fixer not available, etc.
  // actions are native formatter, fixer, or lifecycle actions performed by the agent.
  repeated string actions = 4; // what was done: "goimports", "gofmt", etc.
  // changed reports whether the returned content differs from the original file.
  bool changed = 5;
  // before_sha256 is the lowercase SHA-256 digest of the original content.
  string before_sha256 = 6;
  // after_sha256 is the lowercase SHA-256 digest of the returned content.
  string after_sha256 = 7;
  // wrote reports whether the plugin committed the returned content.
  bool wrote = 8;
  // output preserves bounded formatter/fixer output useful for follow-up linting.
  string output = 9;
}

// ─── Code Edit ────────────────────────────────────────────────

// ApplyEditRequest asks the gateway to apply a smart find/replace edit.
message ApplyEditRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // file is a workspace- or service-relative source file path.
  string file = 2; // relative to service root
  // find is the text or pattern to locate before applying an edit.
  string find = 3; // text to find (smart matching at plugin level)
  // replace is the replacement text used by an edit operation.
  string replace = 4; // replacement text
  // fix_mode controls language-aware rewriting after the edit. SAFE is the default.
  codefly.base.v0.FixMode fix_mode = 5;
  // dry_run returns the edited and fixed content without writing the file.
  bool dry_run = 6;
}

// ApplyEditResponse reports the selected strategy and post-edit content.
message ApplyEditResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // content is the file content after the edit and optional fixers.
  string content = 2; // file content after edit + fix
  // error explains why the operation failed; empty means success at this layer.
  string error = 3; // why the edit failed
  // strategy names the edit or execution strategy that produced the result.
  string strategy = 4; // which matching strategy
  // fix_actions names formatters or import fixers that ran after the edit.
  repeated string fix_actions = 5; // fixers that ran
  // changed reports whether the returned content differs from the original file.
  bool changed = 6;
  // before_sha256 is the lowercase SHA-256 digest of the original content.
  string before_sha256 = 7;
  // after_sha256 is the lowercase SHA-256 digest of the returned content.
  string after_sha256 = 8;
  // wrote reports whether the plugin committed the returned content.
  bool wrote = 9;
  // output preserves bounded formatter/fixer output useful for follow-up linting.
  string output = 10;
}

// BatchApplyEditsRequest applies multiple edits in one call.
message BatchApplyEditsRequest {
  // edits are the requested edits, potentially spanning services.
  repeated ApplyEditRequest edits = 1;
}

// EditResult captures the outcome of one edit inside a batch.
message EditResult {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // file is a workspace- or service-relative source file path.
  string file = 2;
  // success is true when the requested operation completed successfully.
  bool success = 3;
  // error explains why the operation failed; empty means success at this layer.
  string error = 4;
  // strategy names the edit or execution strategy that produced the result.
  string strategy = 5;
}

// BatchApplyEditsResponse returns per-edit outcomes for the batch.
message BatchApplyEditsResponse {
  // results are per-item outcomes returned by the operation.
  repeated EditResult results = 1;
  // succeeded is the number of edits that applied successfully.
  int32 succeeded = 2;
  // failed is the number of edits that failed.
  int32 failed = 3;
}

// ConfigureMutationAuthorityRequest establishes the trust anchor for the
// coordinated mutation path. A running gateway may repeat the same binding,
// but it rejects attempts to replace it with another authority or workspace.
message ConfigureMutationAuthorityRequest {
  string authority_id = 1;
  string workspace_id = 2;
  bytes ed25519_public_key = 3;
}

message ConfigureMutationAuthorityResponse {
  string authority_id = 1;
  string workspace_id = 2;
}

enum PreparedFileOperation {
  PREPARED_FILE_OPERATION_UNSPECIFIED = 0;
  PREPARED_FILE_OPERATION_MODIFY = 1;
}

// PreparedFileMutation is a source-free identity for exact bytes retained by
// Codefly inside the execution box. Mind and the SaaS coordinator receive only
// hashes and resource identity; project content never crosses this RPC.
message PreparedFileMutation {
  string path = 1;
  PreparedFileOperation operation = 2;
  string before_sha256 = 3;
  string after_sha256 = 4;
  reserved 5;
  string strategy = 6;
  repeated string fix_actions = 7;
}

// PreparedMutation is one immutable, version-bound write proposal. The digest
// is SHA-256 over deterministic protobuf bytes with mutation_digest cleared.
message PreparedMutation {
  uint32 schema_version = 1;
  string preparation_id = 2;
  string authority_id = 3;
  string workspace_id = 4;
  string service = 5;
  string workspace_version = 6;
  string mutation_digest = 7;
  repeated PreparedFileMutation files = 8;
  google.protobuf.Timestamp prepared_at = 9;
  google.protobuf.Timestamp expires_at = 10;
}

message PrepareApplyEditMutation {
  string file = 1;
  string find = 2;
  string replace = 3;
  codefly.base.v0.FixMode fix_mode = 4;
}

message PrepareMutationRequest {
  string service = 1;
  string workspace_version = 2;
  oneof mutation {
    PrepareApplyEditMutation apply_edit = 10;
  }
}

message PrepareMutationResponse {
  bool success = 1;
  string error = 2;
  PreparedMutation prepared = 3;
}

message ApplyPreparedMutationRequest {
  string service = 1;
  string preparation_id = 2;
  // mutation_permit is Codefly's v2 Ed25519 scoped-authorization token,
  // minted only after the Work Coordinator admits this exact prepared
  // mutation under a current plan and lease. Codefly verifies it locally.
  string mutation_permit = 3;
  string mutation_digest = 4;
}

message AppliedFileMutation {
  string path = 1;
  PreparedFileOperation operation = 2;
  string before_sha256 = 3;
  string after_sha256 = 4;
}

message ApplyPreparedMutationResponse {
  bool success = 1;
  string error = 2;
  string preparation_id = 3;
  string mutation_digest = 4;
  repeated AppliedFileMutation files = 5;
}

// ─── Search ───────────────────────────────────────────────────

// SearchRequest searches service files through the gateway.
message SearchRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // pattern is the search expression or test filter requested by the caller.
  string pattern = 2; // regex or literal pattern
  // literal treats pattern as plain text instead of a regular expression.
  bool literal = 3; // if true, treat pattern as literal string
  // case_insensitive makes matching ignore letter case.
  bool case_insensitive = 4;
  // path is a workspace- or service-relative filesystem path.
  string path = 5; // optional: restrict to subdirectory
  // extensions restrict file results to the listed suffixes.
  repeated string extensions = 6; // optional: filter by extension (e.g. ".go", ".py")
  // exclude contains glob patterns to skip during the search.
  repeated string exclude = 7; // optional: glob patterns to exclude
  // max_results caps returned matches; zero uses the gateway default.
  int32 max_results = 8; // 0 = default (100)
  // context_lines is the number of neighboring lines returned around each match.
  int32 context_lines = 9; // lines of context around each match
}

// SearchMatch identifies one matching line and optional surrounding context.
message SearchMatch {
  // file is a workspace- or service-relative source file path.
  string file = 1; // relative path
  // line is the 1-based source line number.
  int32 line = 2; // 1-based line number
  // text is the matched source line.
  string text = 3; // the matching line
  // context_before contains lines immediately before the match.
  repeated string context_before = 4;
  // context_after contains lines immediately after the match.
  repeated string context_after = 5;
}

// SearchResponse returns matching source lines and truncation metadata.
message SearchResponse {
  // matches are the search hits returned by the gateway.
  repeated SearchMatch matches = 1;
  // truncated is true when the response was capped before all data could be returned.
  bool truncated = 2;
  // total_matches is the number of hits observed before truncation.
  int32 total_matches = 3;
}

// ─── Build ───────────────────────────────────────────────────

// BuildRequest asks the gateway to run the service build.
message BuildRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
}

// BuildError is a structured build or lint diagnostic.
message BuildError {
  // file is a workspace- or service-relative source file path.
  string file = 1;
  // line is the 1-based source line number.
  int32 line = 2;
  // column is the 1-based source column number when known.
  int32 column = 3;
  // message is the diagnostic text returned by the build or lint tool.
  string message = 4;
  // severity is the diagnostic or finding level reported by the producer.
  string severity = 5; // "error" | "warning"
}

// BuildResponse returns build success, structured diagnostics, and raw output.
message BuildResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // errors are structured build diagnostics.
  repeated BuildError errors = 2;
  // output is raw command, build, lint, or test output retained for diagnosis.
  string output = 3; // raw build output
}

// ─── Lint ─────────────────────────────────────────────────────

// LintRequest asks the gateway to run the service linter.
message LintRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
}

// LintResponse returns lint success, structured diagnostics, and raw output.
message LintResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // errors are structured lint diagnostics.
  repeated BuildError errors = 2; // reuse BuildError for lint diagnostics
  // output is raw command, build, lint, or test output retained for diagnosis.
  string output = 3; // raw lint output
}

// ─── Test ─────────────────────────────────────────────────────

// CodeUnitTarget identifies one ingestion-declared source boundary. The
// gateway uses the path to bind the exact checkout root and lets Codefly
// detect the owning runtime plugin there. Language and native command details
// are deliberately absent: callers name code units, not implementations.
message CodeUnitTarget {
  // id is the stable code-unit identity carried by the caller's task.
  string id = 1;
  // path is the canonical repository-relative code-unit root. Empty and "."
  // both identify the repository root.
  string path = 2;
}

// TestRequest asks the gateway to run the service tests.
message TestRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // runtime_request is the authoritative typed operation forwarded unchanged
  // to the service runtime. In particular, structured selections and their
  // acknowledgement identity must survive this boundary; the gateway must
  // never broaden a scoped request into a whole-service test run.
  codefly.services.runtime.v0.TestRequest runtime_request = 2;
  // code_units is the authoritative set of source boundaries covered by the
  // operation. A single unit binds one exact plugin root. Multiple units make
  // the gateway route each boundary independently and aggregate typed results.
  // Empty preserves the legacy service/root target.
  repeated CodeUnitTarget code_units = 3;
}

// TestResponse returns service test counts and raw runner output.
message TestResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // output is raw command, build, lint, or test output retained for diagnosis.
  string output = 2; // raw test output
  // tests_run is the total number of tests executed.
  int32 tests_run = 3;
  // tests_passed is the number of tests that passed.
  int32 tests_passed = 4;
  // tests_failed is the number of tests that failed.
  int32 tests_failed = 5;
  // tests_skipped is the number of tests skipped by the runner.
  int32 tests_skipped = 6;
  // coverage_pct is the overall coverage percentage when available.
  float coverage_pct = 7;
  // failures are concise failing test names or messages.
  repeated string failures = 8;
  // runtime_response is the authoritative typed runtime result. Callers use
  // it to verify structured-selection acknowledgement and consume the full
  // suite tree. The flat fields above remain a presentation-compatible view.
  codefly.services.runtime.v0.TestResponse runtime_response = 9;
}

// ConfigureServiceRequest asks the owning service plugin to persist typed
// configuration changes. Paths are limited to the schema advertised by that
// plugin (for example test.env.CFLAGS or test.provisioning.python).
message ConfigureServiceRequest {
  string service = 1;
  repeated codefly.services.builder.v0.ConfigChange changes = 2;
}

// ConfigureServiceResponse preserves the builder plugin's authoritative
// status and effective configuration projection.
message ConfigureServiceResponse {
  codefly.services.builder.v0.ConfigureResponse response = 1;
}

// ─── Format ──────────────────────────────────────────────────

// FormatRequest asks the service plugin to apply its canonical formatter and
// import organizer. Empty paths format the plugin-defined changed-file scope.
message FormatRequest {
  // service identifies the code unit whose plugin owns formatting.
  string service = 1;
  // paths limits formatting to these service-relative paths.
  repeated string paths = 2;
}

// FormatResponse reports the authoritative file set changed by the plugin.
message FormatResponse {
  // success reports whether the plugin completed formatting.
  bool success = 1;
  // changed_files lists service-relative files modified by the plugin.
  repeated string changed_files = 2;
  // errors contains structured formatter diagnostics.
  repeated BuildError errors = 3;
  // output preserves plugin output for diagnosis.
  string output = 4;
  // act is the authoritative receipt for the applied formatting act.
  ActReceipt act = 5;
}

// ─── Execution ───────────────────────────────────────────────

// CommandClass classifies why an unstructured execution escape hatch was used.
enum CommandClass {
  // COMMAND_CLASS_UNSPECIFIED is rejected for an escape-hatch call.
  COMMAND_CLASS_UNSPECIFIED = 0;
  // COMMAND_CLASS_VCS covers version-control diagnosis unsupported by typed VCS verbs.
  COMMAND_CLASS_VCS = 1;
  // COMMAND_CLASS_BUILD covers build-system diagnosis unsupported by typed checks.
  COMMAND_CLASS_BUILD = 2;
  // COMMAND_CLASS_PACKAGE covers package-manager diagnosis.
  COMMAND_CLASS_PACKAGE = 3;
  // COMMAND_CLASS_NETWORK covers network diagnosis.
  COMMAND_CLASS_NETWORK = 4;
  // COMMAND_CLASS_FILESYSTEM covers one-off filesystem diagnosis.
  COMMAND_CLASS_FILESYSTEM = 5;
  // COMMAND_CLASS_DIAGNOSTIC covers other read-only diagnostic probes.
  COMMAND_CLASS_DIAGNOSTIC = 6;
  // COMMAND_CLASS_OTHER covers an attributed use outside the named classes.
  COMMAND_CLASS_OTHER = 7;
}

// UnstructuredUse attributes one use of raw process or PTY execution. The
// gateway rejects escape-hatch calls that omit any field.
message UnstructuredUse {
  // intent is the human-readable objective of the command.
  string intent = 1;
  // command_class groups uses into a missing-capability family.
  CommandClass command_class = 2;
  // why_no_tool states why the typed toolbox could not perform this work.
  string why_no_tool = 3;
  // code_unit_id attributes the use to one code unit.
  string code_unit_id = 4;
  // objective_id attributes the use to one Mind objective.
  string objective_id = 5;
}

// RunCommandRequest asks the gateway to run a command in a service context.
message RunCommandRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // command is the executable or shell command requested by the caller.
  string command = 2; // command to execute
  // args are structured or command-line arguments supplied to the tool or command.
  repeated string args = 3; // arguments
  // timeout_seconds caps command execution time; zero uses the default.
  int32 timeout_seconds = 4; // 0 = default (30s)
  // working_dir is an optional service-relative directory for command execution.
  string working_dir = 5; // optional: relative subdirectory
  // stdin is optional bytes written to the process's standard input.
  //
  // CONTRACT (single-shot stdin): the gateway writes the full payload
  // to the child's stdin, closes the stream, then reads stdout/stderr
  // to completion. Not a bidirectional pipe — enough for batch
  // protocols with a fixed upfront request list, e.g. feeding
  // `git cat-file --batch` a list of object names.
  bytes stdin = 6;
  // unstructured_use is mandatory attribution for this escape hatch.
  UnstructuredUse unstructured_use = 7;
}

// RunCommandResponse returns process exit status and captured streams.
message RunCommandResponse {
  // exit_code is the process exit status returned by the operating system.
  int32 exit_code = 1;
  // stdout is the process standard output stream.
  string stdout = 2;
  // stderr is the process standard error stream.
  string stderr = 3;
}

// ─── Runtime / Checks ────────────────────────────────────────

// RunChecksRequest asks the gateway to run verification checks for one service.
message RunChecksRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // checks are verification steps requested by the caller.
  repeated Check checks = 2;
}

// Check describes one verification step the gateway can run.
message Check {
  // name is a caller-chosen identifier for this check.
  string name = 1;
  // check_type selects exactly one supported check type variant.
  oneof check_type {
    // command runs a shell command and evaluates exit code or output.
    CommandCheck command = 2;
    // http calls a service endpoint and evaluates the response.
    HttpCheck http = 3;
    // plugin_build delegates to the service plugin's Build RPC.
    PluginCheck plugin_build = 4;
    // plugin_test delegates to the service plugin's Test RPC.
    PluginCheck plugin_test = 5;
    // plugin_lint delegates to the service plugin's Lint RPC.
    PluginCheck plugin_lint = 6;
  }
}

// PluginCheck delegates to the plugin's Build/Test/Lint RPC (no parameters needed).
message PluginCheck {}

// CommandCheck validates a command's exit code and optional output text.
message CommandCheck {
  // run is the command line executed by a command check.
  string run = 1;
  // expected_exit_code is the process status required for success.
  int32 expected_exit_code = 2;
  // output_contains is text that must appear in command output.
  string output_contains = 3;
}

// HttpCheck validates an HTTP endpoint response.
message HttpCheck {
  // method is the HTTP verb used by the check or API description.
  string method = 1;
  // path is the HTTP path to request on the service endpoint.
  string path = 2;
  // body is the request or response payload.
  string body = 3;
  // expected_status is the HTTP status code required for success.
  int32 expected_status = 4;
  // body_contains is text that must appear in the HTTP response body.
  string body_contains = 5;
}

// CheckResult captures the outcome of one verification check.
message CheckResult {
  // name matches the requested check name.
  string name = 1;
  // passed is true when the check met its expected condition.
  bool passed = 2;
  // output is raw command, build, lint, or test output preserved for diagnostics.
  string output = 3;
  // error explains why the operation failed; empty means success at this layer.
  string error = 4;
}

// RunChecksResponse returns per-check outcomes.
message RunChecksResponse {
  // results are per-item outcomes returned by the operation.
  repeated CheckResult results = 1;
}

// ─── Version Control ─────────────────────────────────────────

// GitStatusRequest asks for git status, optionally scoped to one service directory.
message GitStatusRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1; // optional: filter to service directory
}

// GitFileStatus reports the state and message for the git file lifecycle phase.
message GitFileStatus {
  // path is a workspace- or service-relative filesystem path.
  string path = 1;
  // status is the git, lifecycle, diagnostic, or operation state for this item.
  string status = 2; // "modified", "added", "deleted", "untracked", "renamed", "copied"
  // staged selects or reports the git index instead of the worktree.
  bool staged = 3;
}

// GitStatusResponse returns branch and changed-file status.
message GitStatusResponse {
  // files are changed files reported by git status.
  repeated GitFileStatus files = 1;
  // branch is the current git branch name.
  string branch = 2;
  // error explains why the operation failed; empty means success at this layer.
  string error = 3;
  // repository_root is the canonical absolute root of the Git worktree that
  // contains the Gateway's working directory. Callers use it to preserve a
  // nested invocation directory while binding repository-wide capabilities.
  string repository_root = 4;
}

// GitDiffRequest asks for a git diff, optionally scoped to a path or index.
message GitDiffRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // path is a workspace- or service-relative filesystem path.
  string path = 2; // optional: restrict to a file
  // staged selects or reports the git index instead of the worktree.
  bool staged = 3; // if true, show staged changes
}

// GitDiffResponse returns unified diff text.
message GitDiffResponse {
  // diff is the unified git diff text.
  string diff = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
}

// GitLogRequest asks for recent commit history.
message GitLogRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // count limits how many records should be returned.
  int32 count = 2; // number of commits (default 10)
}

// GitCommitInfo summarizes one commit returned by GitLog.
message GitCommitInfo {
  // hash is the full git commit or content hash.
  string hash = 1;
  // short_hash is the abbreviated git commit hash.
  string short_hash = 2;
  // author is the commit author identity.
  string author = 3;
  // message is the first line of the commit message.
  string message = 4;
  // date is the commit timestamp as reported by git.
  string date = 5;
}

// GitLogResponse returns commit history ordered newest first.
message GitLogResponse {
  // commits are git history entries ordered newest first.
  repeated GitCommitInfo commits = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
}

// GitCommitRequest asks the gateway to commit selected workspace changes.
message GitCommitRequest {
  // message is the commit message to use.
  string message = 1;
  // paths optionally restrict the commit to specific files.
  repeated string paths = 2; // optional: specific files to commit
  // all stages every workspace change before committing.
  bool all = 3;
}

// GitCommitResponse reports the commit hash when the commit succeeds.
message GitCommitResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // hash is the full git commit or content hash.
  string hash = 2;
  // error explains why the operation failed; empty means success at this layer.
  string error = 3;
}

// ActReceipt is the authoritative, LLM-free outcome of one consequential act.
// event_id is stable across an outbound call and its matching inbound event.
message ActReceipt {
  // event_id is the stable reconciliation identity.
  string event_id = 1;
  // kind is the provider-neutral semantic act kind.
  string kind = 2;
  // target identifies the branch, tag, revision, or forge resource acted on.
  string target = 3;
  // state is the authoritative resulting state.
  string state = 4;
  // revision is the authoritative resulting commit SHA when applicable.
  string revision = 5;
  // authoritative_source names the boundary that observed the result.
  string authoritative_source = 6;
  // authoritative_url links to the source record when one exists.
  string authoritative_url = 7;
  // observed_at records when the source confirmed the result.
  google.protobuf.Timestamp observed_at = 8;
}

// GitBranchRequest creates one local branch without switching to it.
message GitBranchRequest {
  // service identifies the repository.
  string service = 1;
  // name is the new branch name.
  string name = 2;
  // start_point is the revision used as the branch head; empty means HEAD.
  string start_point = 3;
  // force moves an existing local branch to start_point.
  bool force = 4;
}

// GitBranchResponse reports the created branch and resolved revision.
message GitBranchResponse {
  // success reports whether branch creation completed.
  bool success = 1;
  // error explains a failed creation.
  string error = 2;
  // branch is the canonical created branch name.
  string branch = 3;
  // revision is the resolved branch head.
  string revision = 4;
  // act is the authoritative typed outcome.
  ActReceipt act = 5;
}

// GitCheckoutRequest switches the repository to ref.
message GitCheckoutRequest {
  // service identifies the repository.
  string service = 1;
  // ref is an existing branch or revision.
  string ref = 2;
  // detach checks out the resolved commit instead of attaching HEAD to a branch.
  bool detach = 3;
}

// GitCheckoutResponse reports the checked-out branch and revision.
message GitCheckoutResponse {
  // success reports whether checkout completed.
  bool success = 1;
  // error explains a failed checkout.
  string error = 2;
  // branch is the checked-out branch or HEAD when detached.
  string branch = 3;
  // revision is the checked-out commit.
  string revision = 4;
  // act is the authoritative typed outcome.
  ActReceipt act = 5;
}

// GitPushMode deliberately excludes unconstrained force-push.
enum GitPushMode {
  // GIT_PUSH_MODE_UNSPECIFIED is rejected.
  GIT_PUSH_MODE_UNSPECIFIED = 0;
  // GIT_PUSH_MODE_FAST_FORWARD_ONLY forbids any non-fast-forward update.
  GIT_PUSH_MODE_FAST_FORWARD_ONLY = 1;
  // GIT_PUSH_MODE_FORCE_WITH_LEASE permits only lease-protected replacement.
  GIT_PUSH_MODE_FORCE_WITH_LEASE = 2;
}

// GitPushRequest publishes one local branch.
message GitPushRequest {
  // service identifies the repository.
  string service = 1;
  // remote is the configured destination; empty selects origin.
  string remote = 2;
  // branch is the local branch to publish; empty selects the current branch.
  string branch = 3;
  // set_upstream records remote tracking configuration.
  bool set_upstream = 4;
  // mode controls non-fast-forward safety.
  GitPushMode mode = 5;
}

// GitPushResponse reports the remote ref confirmed by git.
message GitPushResponse {
  // success reports whether the remote accepted the update.
  bool success = 1;
  // error explains a rejected or failed push.
  string error = 2;
  // remote is the destination remote name.
  string remote = 3;
  // branch is the published branch.
  string branch = 4;
  // revision is the published commit.
  string revision = 5;
  // act is the authoritative typed outcome.
  ActReceipt act = 6;
}

// GitTagRequest creates an annotated or signed tag.
message GitTagRequest {
  // service identifies the repository.
  string service = 1;
  // name is the tag name.
  string name = 2;
  // revision is the tagged revision; empty means HEAD.
  string revision = 3;
  // message is the annotation.
  string message = 4;
  // sign requests the configured signing identity.
  bool sign = 5;
}

// GitTagResponse reports the created tag and target revision.
message GitTagResponse {
  // success reports whether tag creation completed.
  bool success = 1;
  // error explains a failed tag operation.
  string error = 2;
  // tag is the created tag name.
  string tag = 3;
  // revision is the tagged commit.
  string revision = 4;
  // act is the authoritative typed outcome.
  ActReceipt act = 5;
}

// GitMergeRequest merges ref into the current branch.
message GitMergeRequest {
  // service identifies the repository.
  string service = 1;
  // ref is the revision to merge.
  string ref = 2;
  // message overrides the merge commit message.
  string message = 3;
  // no_fast_forward requires a merge commit.
  bool no_fast_forward = 4;
}

// GitMergeResponse reports the resulting branch head.
message GitMergeResponse {
  // success reports whether the merge completed.
  bool success = 1;
  // error explains a failed merge.
  string error = 2;
  // branch is the branch receiving the merge.
  string branch = 3;
  // revision is the resulting head.
  string revision = 4;
  // act is the authoritative typed outcome.
  ActReceipt act = 5;
}

// GitRevertRequest reverts one existing commit.
message GitRevertRequest {
  // service identifies the repository.
  string service = 1;
  // revision is the commit to revert.
  string revision = 2;
}

// GitRevertResponse reports the new revert commit.
message GitRevertResponse {
  // success reports whether revert completed.
  bool success = 1;
  // error explains a failed revert.
  string error = 2;
  // reverted_revision is the commit that was reverted.
  string reverted_revision = 3;
  // revision is the new revert commit.
  string revision = 4;
  // act is the authoritative typed outcome.
  ActReceipt act = 5;
}

// RepositoryRemoteAccess makes remote credential/configuration authority
// explicit. Public qualification sources must never inherit developer Git
// rewrites, credential helpers, SSH agents, or interactive prompts.
enum RepositoryRemoteAccess {
  // REPOSITORY_REMOTE_ACCESS_UNSPECIFIED is rejected.
  REPOSITORY_REMOTE_ACCESS_UNSPECIFIED = 0;
  // REPOSITORY_REMOTE_ACCESS_PUBLIC_HTTPS accepts only credential-free HTTPS
  // URLs and executes with isolated Git configuration.
  REPOSITORY_REMOTE_ACCESS_PUBLIC_HTTPS = 1;
  // REPOSITORY_REMOTE_ACCESS_CONFIGURED explicitly authorizes Codefly's
  // configured runtime Git/SSH environment for a private remote.
  REPOSITORY_REMOTE_ACCESS_CONFIGURED = 2;
  // REPOSITORY_REMOTE_ACCESS_LOCAL_FILE explicitly authorizes a file://
  // remote, primarily for deterministic local infrastructure qualification.
  REPOSITORY_REMOTE_ACCESS_LOCAL_FILE = 3;
}

// MaterializeRepositorySnapshotRequest asks Codefly to ensure a repository
// cache, resolve one immutable revision, and create one detached worktree.
// All directory fields are relative to the Gateway root.
message MaterializeRepositorySnapshotRequest {
  // repository_url is the exact remote declared by the caller.
  string repository_url = 1;
  // cache_directory stores the shared clone/object cache.
  string cache_directory = 2;
  // revision is the advertised remote ref or full commit to resolve.
  string revision = 3;
  // fetch_identity makes the temporary ref unique across callers.
  string fetch_identity = 4;
  // snapshot_directory is the detached worktree lease destination.
  string snapshot_directory = 5;
  // remote_access selects the only allowed credential/configuration source.
  RepositoryRemoteAccess remote_access = 6;
}

// MaterializeRepositorySnapshotResponse returns the immutable commit leased
// into snapshot_directory.
message MaterializeRepositorySnapshotResponse {
  // success reports whether the repository and detached worktree are ready.
  bool success = 1;
  // error explains a failed materialization.
  string error = 2;
  // revision is the resolved full commit SHA.
  string revision = 3;
  // snapshot_directory echoes the validated Gateway-relative lease path.
  string snapshot_directory = 4;
}

// PrepareRepositoryCheckoutRequest asks Codefly to ensure a repository cache,
// resolve one immutable revision, then force the cache worktree to that commit.
message PrepareRepositoryCheckoutRequest {
  // repository_url is the exact remote declared by the caller.
  string repository_url = 1;
  // cache_directory is the mutable checkout, relative to the Gateway root.
  string cache_directory = 2;
  // revision is the advertised remote ref or full commit to resolve.
  string revision = 3;
  // fetch_identity makes the temporary ref unique across callers.
  string fetch_identity = 4;
  // remote_access selects the only allowed credential/configuration source.
  RepositoryRemoteAccess remote_access = 5;
}

// PrepareRepositoryCheckoutResponse returns the exact clean checkout state.
message PrepareRepositoryCheckoutResponse {
  // success reports whether the mutable checkout is ready.
  bool success = 1;
  // error explains a failed preparation.
  string error = 2;
  // revision is the resolved full commit SHA now checked out.
  string revision = 3;
  // default_branch is the remote's advertised default branch when available.
  string default_branch = 4;
}

// ReleaseRepositorySnapshotRequest identifies a previously materialized
// detached worktree. Both paths are relative to the Gateway root.
message ReleaseRepositorySnapshotRequest {
  // cache_directory identifies the repository that owns the worktree.
  string cache_directory = 1;
  // snapshot_directory identifies the worktree lease to release.
  string snapshot_directory = 2;
}

// ReleaseRepositorySnapshotResponse reports cleanup of the worktree lease.
message ReleaseRepositorySnapshotResponse {
  // success reports whether removal and metadata pruning completed.
  bool success = 1;
  // error explains a failed release.
  string error = 2;
}

// ReleaseBump selects the semantic version component to increment.
enum ReleaseBump {
  // RELEASE_BUMP_UNSPECIFIED is rejected.
  RELEASE_BUMP_UNSPECIFIED = 0;
  // RELEASE_BUMP_PATCH increments the patch component.
  RELEASE_BUMP_PATCH = 1;
  // RELEASE_BUMP_MINOR increments the minor component.
  RELEASE_BUMP_MINOR = 2;
  // RELEASE_BUMP_MAJOR increments the major component.
  RELEASE_BUMP_MAJOR = 3;
}

// ReleaseUnit identifies one versioned code unit in the release.
message ReleaseUnit {
  // code_unit_id is the stable caller-visible unit identity.
  string code_unit_id = 1;
  // version_file is the repository-relative manifest containing its version.
  string version_file = 2;
}

// ReleasedUnit reports one version mutation included in the release.
message ReleasedUnit {
  // code_unit_id is the stable caller-visible unit identity.
  string code_unit_id = 1;
  // version_file is the repository-relative manifest that was changed.
  string version_file = 2;
  // version is the released semantic version without the v prefix.
  string version = 3;
}

// ReleaseRequest publishes one signed semantic release for one or more code
// units in a repository.
message ReleaseRequest {
  // service identifies the repository Gateway.
  string service = 1;
  // bump selects the semantic version component to increment.
  ReleaseBump bump = 2;
  // units are versioned together in one commit and one signed tag.
  repeated ReleaseUnit units = 3;
}

// ReleaseResponse reports the remote-confirmed release.
message ReleaseResponse {
  // success reports whether the release was published.
  bool success = 1;
  // error explains a failed release.
  string error = 2;
  // tag is the published semantic version tag.
  string tag = 3;
  // revision is the published release commit.
  string revision = 4;
  // act is the authoritative typed outcome.
  ActReceipt act = 5;
  // units are the version mutations included in the release.
  repeated ReleasedUnit units = 6;
}

// ─── Forge ───────────────────────────────────────────────────

// ForgeMergeMethod is the provider-neutral pull-request merge strategy.
enum ForgeMergeMethod {
  // FORGE_MERGE_METHOD_UNSPECIFIED is rejected.
  FORGE_MERGE_METHOD_UNSPECIFIED = 0;
  // FORGE_MERGE_METHOD_MERGE creates a merge commit.
  FORGE_MERGE_METHOD_MERGE = 1;
  // FORGE_MERGE_METHOD_SQUASH creates one squashed commit.
  FORGE_MERGE_METHOD_SQUASH = 2;
  // FORGE_MERGE_METHOD_REBASE rebases commits onto the base branch.
  FORGE_MERGE_METHOD_REBASE = 3;
}

// ForgeCheckPolicy controls whether a merge may bypass failing checks.
enum ForgeCheckPolicy {
  // FORGE_CHECK_POLICY_UNSPECIFIED is rejected.
  FORGE_CHECK_POLICY_UNSPECIFIED = 0;
  // FORGE_CHECK_POLICY_REQUIRE_PASSING rejects a blocked merge.
  FORGE_CHECK_POLICY_REQUIRE_PASSING = 1;
  // FORGE_CHECK_POLICY_BYPASS delegates any allowed bypass to the provider.
  FORGE_CHECK_POLICY_BYPASS = 2;
}

// ForgeRepository identifies a repository without leaking provider URL shapes.
message ForgeRepository {
  // provider is the toolbox provider name, such as github.
  string provider = 1;
  // owner is the provider namespace.
  string owner = 2;
  // name is the repository name.
  string name = 3;
}

// ForgeCheck is one CI check or commit-status context.
message ForgeCheck {
  // id is the provider's stable check identity.
  string id = 1;
  // name is the check context displayed to users.
  string name = 2;
  // state is the provider-neutral queued, in_progress, or completed state.
  string state = 3;
  // conclusion is the terminal result when completed.
  string conclusion = 4;
  // required reports whether branch protection requires this check.
  bool required = 5;
  // url links to authoritative check details.
  string url = 6;
}

// ForgeReview is one pull-request review.
message ForgeReview {
  // id is the provider's stable review identity.
  string id = 1;
  // author is the reviewer login.
  string author = 2;
  // state is the provider-neutral review verdict.
  string state = 3;
  // submitted_at is the provider-recorded submission time.
  google.protobuf.Timestamp submitted_at = 4;
}

// ForgePullRequestStatus is one authoritative PR/check/review snapshot.
message ForgePullRequestStatus {
  // repository identifies the forge resource.
  ForgeRepository repository = 1;
  // number is the provider pull-request number.
  int64 number = 2;
  // state is the pull-request lifecycle state.
  string state = 3;
  // head_sha is the exact checked revision.
  string head_sha = 4;
  // base_branch is the merge destination.
  string base_branch = 5;
  // mergeable is the provider's current mergeability verdict.
  bool mergeable = 6;
  // checks are current CI and commit-status facts.
  repeated ForgeCheck checks = 7;
  // reviews are current review facts.
  repeated ForgeReview reviews = 8;
  // blocking_reason explains why the pull request cannot merge.
  string blocking_reason = 9;
  // url links to the authoritative pull request.
  string url = 10;
  // observed_at records when the provider snapshot was fetched.
  google.protobuf.Timestamp observed_at = 11;
}

// ForgePullRequestStatusRequest selects one pull request.
message ForgePullRequestStatusRequest {
  // service identifies the workspace used for provider defaults.
  string service = 1;
  // repository identifies the forge resource.
  ForgeRepository repository = 2;
  // number is the pull-request number.
  int64 number = 3;
}

// ForgePullRequestStatusResponse returns one typed provider snapshot.
message ForgePullRequestStatusResponse {
  // status is the authoritative snapshot.
  ForgePullRequestStatus status = 1;
  // error explains why the provider could not return a snapshot.
  string error = 2;
}

// ForgeMergePullRequestRequest merges one pull request.
message ForgeMergePullRequestRequest {
  // service identifies the workspace used for provider defaults.
  string service = 1;
  // repository identifies the forge resource.
  ForgeRepository repository = 2;
  // number is the pull-request number.
  int64 number = 3;
  // method selects the provider-neutral merge strategy.
  ForgeMergeMethod method = 4;
  // check_policy controls required-check enforcement.
  ForgeCheckPolicy check_policy = 5;
  // commit_title optionally overrides the merge commit title.
  string commit_title = 6;
  // commit_message optionally overrides the merge commit body.
  string commit_message = 7;
}

// ForgeMergePullRequestResponse reports the provider-confirmed merge.
message ForgeMergePullRequestResponse {
  // success reports whether the provider confirmed the merge.
  bool success = 1;
  // error explains a rejected or failed merge.
  string error = 2;
  // status is the authoritative post-operation snapshot.
  ForgePullRequestStatus status = 3;
  // act is the reconciliable provider outcome.
  ActReceipt act = 4;
}

// ForgeRequestReviewRequest requests users or teams on one pull request.
message ForgeRequestReviewRequest {
  // service identifies the workspace used for provider defaults.
  string service = 1;
  // repository identifies the forge resource.
  ForgeRepository repository = 2;
  // number is the pull-request number.
  int64 number = 3;
  // reviewers are provider user logins.
  repeated string reviewers = 4;
  // team_reviewers are provider team slugs.
  repeated string team_reviewers = 5;
}

// ForgeRequestReviewResponse reports provider-confirmed reviewer requests.
message ForgeRequestReviewResponse {
  // success reports whether the provider accepted the request.
  bool success = 1;
  // error explains a failed reviewer request.
  string error = 2;
  // reviewers are accepted user logins.
  repeated string reviewers = 3;
  // team_reviewers are accepted team slugs.
  repeated string team_reviewers = 4;
  // act is the reconciliable provider outcome.
  ActReceipt act = 5;
}

// ForgeEventKind is the provider-neutral event family.
enum ForgeEventKind {
  FORGE_EVENT_KIND_UNSPECIFIED = 0;
  FORGE_EVENT_KIND_PULL_REQUEST = 1;
  FORGE_EVENT_KIND_CHECK = 2;
  FORGE_EVENT_KIND_REVIEW = 3;
}

// ForgeEvent is one provider-authoritative event normalized by the toolbox.
message ForgeEvent {
  string event_id = 1;
  ForgeEventKind kind = 2;
  string ref = 3;
  ForgeRepository repository = 4;
  int64 number = 5;
  string revision = 6;
  string state = 7;
  string check_name = 8;
  string conclusion = 9;
  string author = 10;
  string authoritative_url = 11;
  string authoritative_source = 12;
  google.protobuf.Timestamp observed_at = 13;
}

// ForgeNormalizeWebhookRequest carries the signed provider delivery to the
// toolbox that owns provider schemas and signature rules.
message ForgeNormalizeWebhookRequest {
  string service = 1;
  string provider = 2;
  string event_type = 3;
  string delivery_id = 4;
  bytes payload = 5;
  string signature = 6;
  string secret = 7;
}

message ForgeNormalizeWebhookResponse {
  ForgeEvent event = 1;
  string error = 2;
}

// ─── Dependency Management ───────────────────────────────────

// Dependency represents a package or module dependency.
message Dependency {
  // name is the package, module, or dependency identifier.
  string name = 1;
  // version is the semantic or service-specific version for this resource.
  string version = 2;
  // direct is true when the dependency is declared directly rather than transitively inferred.
  bool direct = 3;
}

// ListDependenciesRequest carries optional filters for listing dependencies.
message ListDependenciesRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
}

// ListDependenciesResponse returns dependencies discovered by the native package manager.
message ListDependenciesResponse {
  // dependencies are packages or services required by this resource.
  repeated Dependency dependencies = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
}

// AddDependencyRequest identifies a package to install through the native package manager.
message AddDependencyRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // package_name is the package or dependency identifier used by the native manager.
  string package_name = 2;
  // version is the semantic or service-specific version for this resource.
  string version = 3;
}

// AddDependencyResponse reports the dependency version resolved by the package manager.
message AddDependencyResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
  // installed_version is the version resolved by the package manager.
  string installed_version = 3;
}

// RemoveDependencyRequest identifies a package to remove through the native package manager.
message RemoveDependencyRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
  // package_name is the package or dependency identifier used by the native manager.
  string package_name = 2;
}

// RemoveDependencyResponse reports whether the package manager removed the dependency.
message RemoveDependencyResponse {
  // success is true when the requested operation completed successfully.
  bool success = 1;
  // error explains why the operation failed; empty means success at this layer.
  string error = 2;
}

// ─── Project Analysis ────────────────────────────────────────

// PackageInfo describes a single package/module within the project.
message PackageInfo {
  // name is the language-level package or module name.
  string name = 1; // e.g. "github.com/codefly-dev/mind/pkg/run"
  // relative_path is the package directory relative to the service root.
  string relative_path = 2; // e.g. "pkg/run"
  // files are source files that belong to this package.
  repeated string files = 3; // files in the package
  // imports are direct imports used by files in this package.
  repeated string imports = 4; // direct imports
  // doc is package-level documentation extracted from source comments.
  string doc = 5; // package doc comment
}

// GetProjectInfoRequest identifies the project info data to retrieve.
message GetProjectInfoRequest {
  // service is the Codefly service name, optionally scoped by module in callers.
  string service = 1;
}

// GetProjectInfoResponse returns language metadata useful for ingestion and planning.
message GetProjectInfoResponse {
  // module is the Codefly module name that groups services.
  string module = 1; // e.g. "github.com/codefly-dev/mind"
  // language is the implementation language detected for this service or project.
  string language = 2; // e.g. "go"
  // language_version is the detected compiler or runtime version.
  string language_version = 3; // e.g. "1.25"
  // packages describes the package or module layout within the service.
  repeated PackageInfo packages = 4; // package structure
  // dependencies are packages discovered from manifests or lock files.
  repeated Dependency dependencies = 5; // reuse existing Dependency message
  // file_hashes maps source paths to content hashes for change detection.
  map<string, string> file_hashes = 6; // path -> SHA-256 for change detection
  // error explains why the operation failed; empty means success at this layer.
  string error = 7;
}

// DiscoverCodeUnitsRequest identifies the service whose rooted source tree is
// inspected. Empty service selects the gateway's attached source behavior.
message DiscoverCodeUnitsRequest {
  string service = 1;
}

// CodeUnitInfo is the gateway projection of the Code service's structural
// discovery result.
message CodeUnitInfo {
  string path = 1;
  string name = 2;
  string primary_language = 3;
  repeated string languages = 4;
  repeated string manifest_paths = 5;
  string runtime_agent = 6;
}

// DiscoverCodeUnitsResponse preserves every discovered source boundary.
message DiscoverCodeUnitsResponse {
  repeated CodeUnitInfo code_units = 1;
  string error = 2;
}

// ─── Plugin Commands ────────────────────────────────────────

// AvailableCommand describes a built-in or plugin command exposed through the gateway.
message AvailableCommand {
  // name is the command name accepted by the gateway.
  string name = 1; // e.g. "reset_db"
  // description tells users and agents when this command is useful.
  string description = 2; // "Reset the database to a clean state"
  // usage is the command-line shape shown to users and agents.
  string usage = 3; // "! reset_db [--seed]"
  // aliases are alternate command names accepted by the plugin.
  repeated string aliases = 4;
  // tags are labels used for filtering, grouping, or display.
  repeated string tags = 5;
  // plugin identifies the plugin that provides this command; empty means built-in.
  string plugin = 6; // which plugin provides this, empty for built-in
  // destructive is true when the operation can mutate or delete user state.
  bool destructive = 7; // if true, requires user confirmation
}

// ListAllCommandsRequest carries optional filters for listing all commands.
message ListAllCommandsRequest {}

// ListAllCommandsResponse returns the gateway command catalog.
message ListAllCommandsResponse {
  // commands are plugin or built-in commands available to callers.
  repeated AvailableCommand commands = 1;
}

// ─── Terminal ────────────────────────────────────────────────

// OpenTerminalRequest spawns a shell in the gateway's working directory.
message OpenTerminalRequest {
  // shell to run; empty = $SHELL else /bin/sh.
  string shell = 1;
  // working_dir relative to the gateway root; empty = the root itself.
  string working_dir = 2;
  // initial PTY size; 0 = server default.
  uint32 rows = 3;
  // cols is the initial terminal width; 0 selects the server default.
  uint32 cols = 4;
  // unstructured_use is mandatory attribution for this escape hatch.
  UnstructuredUse unstructured_use = 5;
}

// OpenTerminalResponse identifies the spawned terminal.
message OpenTerminalResponse {
  // terminal_id is the opaque identifier used by attach, resize, and close calls.
  string terminal_id = 1;
  // shell is the resolved shell executable selected by the server.
  string shell = 2;
  // working_dir is the resolved directory in which the shell was started.
  string working_dir = 3;
}

// TerminalInput carries client keystrokes. The FIRST message on an Attach
// stream must set terminal_id to select the terminal.
message TerminalInput {
  // terminal_id selects the terminal and is required on the first stream message.
  string terminal_id = 1;
  // data contains raw bytes to write to the terminal's PTY.
  bytes data = 2;
}

// TerminalOutput carries raw PTY bytes (escape codes intact). done marks the
// final frame after the child exits.
message TerminalOutput {
  // terminal_id identifies the terminal that produced this frame.
  string terminal_id = 1;
  // data contains raw PTY output bytes, including terminal escape sequences.
  bytes data = 2;
  // done is true on the final frame after the child process exits.
  bool done = 3;
  // exit_code is the child process exit status and is meaningful when done is true.
  int32 exit_code = 4;
}

// ResizeTerminalRequest changes the PTY dimensions of a running terminal.
message ResizeTerminalRequest {
  // terminal_id identifies the terminal whose PTY should be resized.
  string terminal_id = 1;
  // rows is the requested terminal height in character cells.
  uint32 rows = 2;
  // cols is the requested terminal width in character cells.
  uint32 cols = 3;
}

// ResizeTerminalResponse confirms that the resize request was applied.
message ResizeTerminalResponse {}

// CloseTerminalRequest terminates and removes one terminal session.
message CloseTerminalRequest {
  // terminal_id identifies the terminal to close.
  string terminal_id = 1;
}

// CloseTerminalResponse confirms that the terminal was closed.
message CloseTerminalResponse {}

// ListTerminalsRequest requests every terminal visible to this gateway session.
message ListTerminalsRequest {}

// TerminalInfo describes one terminal session without exposing its PTY stream.
message TerminalInfo {
  // terminal_id is the opaque identifier used by terminal operations.
  string terminal_id = 1;
  // shell is the executable running inside the terminal.
  string shell = 2;
  // working_dir is the directory in which the shell was started.
  string working_dir = 3;
  // status is either "running" or "exited".
  string status = 4;
}

// ListTerminalsResponse returns the terminal sessions visible to the caller.
message ListTerminalsResponse {
  // terminals contains one entry per visible terminal session.
  repeated TerminalInfo terminals = 1;
}
