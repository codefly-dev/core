# REJECTED, ErrWrongDomain. The same withdrawal as the tombstone fixture, at a
# higher generation, from a delivery that speaks for a different ownership
# domain than the one this binding was applied under.
#
# This is the case the domain exists for. Without the check, "within domain D
# the delivered set is exactly desired" is a rule any delivery satisfies for
# any D it chooses to write — so a module-scoped delivery could withdraw every
# binding on the host by declaring a higher generation under their domain. The
# generation here is higher than the applied one, so monotonicity admits it;
# ownership is what refuses it.
