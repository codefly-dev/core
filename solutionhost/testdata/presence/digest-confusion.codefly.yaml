# REJECTED, ErrDigestConfusion. The workload's image digest is the same string
# as the rendered digest of the artifact that renders it.
#
# This is the mix-up the three digest types exist to prevent, caught here in
# the data because a renderer assembling YAML by hand is outside the reach of
# the compiler. Rendered bytes and an OCI image manifest do not hash alike by
# accident — equality would need a SHA-256 collision — so one value in both
# places is evidence that one object was written where the other belongs.
#
# Nothing in this package compares the two digests to decide anything; this
# rule refuses a document in which they are indistinguishable, which is a
# different thing and the reason the refusal is readable at all. Left to run,
# the symptom would be a credential refusal on a healthy pod with no stated
# cause.
