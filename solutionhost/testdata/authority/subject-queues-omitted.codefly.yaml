
# REJECTED, ErrInvalid, rule authority-subject-declared. The valid document with
# its `queues:` list deleted — a renderer that resolved the contract and then
# forgot to project one of its three subject declarations.
#
# This is the whole reason the three are REQUIRED rather than optional. An
# omitted list decodes to nothing, which reads exactly like "the module owns no
# queue" — so the document would deliver a module narrower than the contract
# described, a host would enforce the narrower one, and nothing would be wrong
# with the bytes. Written out, as [] when there are none, the two cannot look
# the same.
