# REJECTED. The valid authority document with a merge key at its top level. The
# authority reader shares the presence reader's node checks, so the refusal of
# a merge key — a mapping the typed decoder would apply after every rule had
# run — is inherited here rather than implemented twice.
# ACCEPTED. A complete authority document: what two principals hold on one
# host, within the ceiling FixtureEnvelope describes, effective for one exact
# build and from one presence generation onwards.
#
# It grants nothing on its own. Activate pairs it with the "valid" presence
# fixture and the build both name; either document alone activates nothing,
# which is the whole point of there being two.
#
# The approved build is the image digest the presence fixture's workload
# declares. That is the tie: authority is held for the build that was reviewed,
# so shipping a new build does not carry the old build's authority forward.
