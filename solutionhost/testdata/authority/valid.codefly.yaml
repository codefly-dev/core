# ACCEPTED. A complete authority document: what the subject module declares
# about itself, what two principals hold on one host, within the ceiling
# FixtureEnvelope describes, effective for one exact build and from one presence
# generation onwards.
#
# It grants nothing on its own. Activate pairs it with the "valid" presence
# fixture and the build both name; either document alone activates nothing,
# which is the whole point of there being two.
#
# The approved build is the image digest the presence fixture's workload
# declares. That is the tie: authority is held for the build that was reviewed,
# so shipping a new build does not carry the old build's authority forward.
#
# It owns TWO queues and emits under TWO audit namespaces, which is the shape
# v1 could not render at all: one queue and one namespace lived on each unit of
# authority, so a module-level declaration had nowhere to go and the renderer
# refused the contract rather than deliver a module narrower than it described.
# They are the module's inventory, held against the envelope element by
# element — never a claim on "any queue".
